const P='sbj_cpp';
const LESSONS=[{"title":"Вывод cout","tasks":[{"name":"Привет, мир!","code":"#include \u003ciostream>\nusing namespace std;\nint main(){ cout \u003c\u003c \"Привет, мир!\" \u003c\u003c endl; return 0; }","expect":"Привет, мир!","hint":"cout \u003c\u003c текст \u003c\u003c endl;"},{"name":"Выводим числа","code":"#include \u003ciostream>\nusing namespace std;\nint main(){ cout \u003c\u003c 42 \u003c\u003c endl; cout \u003c\u003c 3 + 5 \u003c\u003c endl; return 0; }","expect":"42\n8","hint":"Числа без кавычек, cout сам считает"},{"name":"Несколько строк","code":"#include \u003ciostream>\nusing namespace std;\nint main(){ cout \u003c\u003c \"Первая\" \u003c\u003c endl \u003c\u003c \"Вторая\" \u003c\u003c endl; return 0; }","expect":"Первая\nВторая","hint":"endl — перенос строки"}]},{"title":"Переменные и типы","tasks":[{"name":"int и string","code":"#include \u003ciostream>\nusing namespace std;\nint main(){ int age = 12; string name = \"Дима\"; cout \u003c\u003c name \u003c\u003c \" \" \u003c\u003c age \u003c\u003c endl; return 0; }","expect":"Дима 12","hint":"Тип имя = значение;"},{"name":"double и char","code":"#include \u003ciostream>\nusing namespace std;\nint main(){ double x = 2.5; char c = 'A'; cout \u003c\u003c x \u003c\u003c \" \" \u003c\u003c c \u003c\u003c endl; return 0; }","expect":"2.5 A","hint":"double — дробные, char — один символ"},{"name":"Арифметика","code":"#include \u003ciostream>\nusing namespace std;\nint main(){ int a = 10, b = 4; cout \u003c\u003c a + b \u003c\u003c \" \" \u003c\u003c a - b \u003c\u003c \" \" \u003c\u003c a / b \u003c\u003c \" \" \u003c\u003c a % b \u003c\u003c endl; return 0; }","expect":"14 6 2 2","hint":"/ целочисленное, % остаток"}]},{"title":"Ввод cin","tasks":[{"name":"Вводим число","code":"#include \u003ciostream>\nusing namespace std;\nint main(){ int n; cin >> n; cout \u003c\u003c \"Ввели \" \u003c\u003c n \u003c\u003c endl; return 0; }","expect":"Ввели","hint":"cin >> переменная;"},{"name":"Сумма двух","code":"#include \u003ciostream>\nusing namespace std;\nint main(){ int a,b; cin >> a >> b; cout \u003c\u003c a + b \u003c\u003c endl; return 0; }","expect":"","hint":"cin >> a >> b;"}]},{"title":"Условия if","tasks":[{"name":"if/else","code":"#include \u003ciostream>\nusing namespace std;\nint main(){ int age = 12; if(age >= 18) cout \u003c\u003c \"Взрослый\"; else cout \u003c\u003c \"Ребёнок\"; return 0; }","expect":"Ребёнок","hint":"if(условие) ... else ..."},{"name":"Чётное число","code":"#include \u003ciostream>\nusing namespace std;\nint main(){ int n = 7; if(n % 2 == 0) cout \u003c\u003c \"Чётное\"; else cout \u003c\u003c \"Нечётное\"; return 0; }","expect":"Нечётное","hint":"n % 2 == 0 — чётное"}]},{"title":"Циклы","tasks":[{"name":"for 1..5","code":"#include \u003ciostream>\nusing namespace std;\nint main(){ for(int i=1; i\u003c=5; i++) cout \u003c\u003c i \u003c\u003c endl; return 0; }","expect":"1\n2\n3\n4\n5","hint":"for(инициализация; условие; шаг)"},{"name":"while и сумма","code":"#include \u003ciostream>\nusing namespace std;\nint main(){ int s=0, i=1; while(i\u003c=5){ s+=i; i++; } cout \u003c\u003c s \u003c\u003c endl; return 0; }","expect":"15","hint":"s += i накапливает сумму"}]},{"title":"Массивы","tasks":[{"name":"Вывод массива","code":"#include \u003ciostream>\nusing namespace std;\nint main(){ int a[3]={7,8,9}; for(int i=0;i\u003c3;i++) cout \u003c\u003c a[i] \u003c\u003c endl; return 0; }","expect":"7\n8\n9","hint":"a[i] — элемент по индексу, с 0"},{"name":"Сумма массива","code":"#include \u003ciostream>\nusing namespace std;\nint main(){ int a[4]={1,2,3,4}, s=0; for(int i=0;i\u003c4;i++) s+=a[i]; cout \u003c\u003c s \u003c\u003c endl; return 0; }","expect":"10","hint":"пройди массив и накопи сумму"}]},{"title":"Функции","tasks":[{"name":"Своя функция","code":"#include \u003ciostream>\nusing namespace std;\nint doubleIt(int x){ return x*2; }\nint main(){ cout \u003c\u003c doubleIt(5) \u003c\u003c \" \" \u003c\u003c doubleIt(8) \u003c\u003c endl; return 0; }","expect":"10 16","hint":"Тип имя(параметры){ return ...; }"},{"name":"Два параметра","code":"#include \u003ciostream>\nusing namespace std;\nint add(int a,int b){ return a+b; }\nint main(){ cout \u003c\u003c add(3,5) \u003c\u003c \" \" \u003c\u003c add(10,7) \u003c\u003c endl; return 0; }","expect":"8 17","hint":"int add(int a,int b){ return a+b; }"}]},{"title":"Строки и проект","tasks":[{"name":"Конкатенация","code":"#include \u003ciostream>\nusing namespace std;\nint main(){ string s = \"Привет, \"; s += \"мир!\"; cout \u003c\u003c s \u003c\u003c endl; return 0; }","expect":"Привет, мир!","hint":"s += \"...\" добавляет к строке"},{"name":"Калькулятор","code":"#include \u003ciostream>\nusing namespace std;\nint main(){ int a=15,b=4; cout \u003c\u003c a \u003c\u003c \"+\" \u003c\u003c b \u003c\u003c \"=\" \u003c\u003c a+b \u003c\u003c endl; cout \u003c\u003c a \u003c\u003c \"*\" \u003c\u003c b \u003c\u003c \"=\" \u003c\u003c a*b \u003c\u003c endl; return 0; }","expect":"15+4=19\n15*4=60","hint":"Выведи результат операций"}]}];
const THEORY={"0_0":"## Твой первый код на C++\n\nПрограмма C++ начинается с `#include \u003ciostream>` — библиотека ввода/вывода.\n\n`cout` печатает на экран, `endl` — перенос строки.\n\n> Чтобы компилятор засчитал задание, код должен совпадать с эталоном (без лишних пробелов не критично).","0_1":"## Числа\n\nЧисла выводятся без кавычек. Компилятор сам посчитает выражение.\n\n```cpp\ncout \u003c\u003c 42 \u003c\u003c endl;\ncout \u003c\u003c 3 + 5 \u003c\u003c endl;  // 8\n```","0_2":"## Несколько строк\n\n`endl` завершает строку. Выражения соединяются через `\u003c\u003c`.","1_0":"## Переменные\n\n`Тип имя = значение;` — объявление переменной.\n\n| Тип | Что хранит |\n|-----|-----------|\n| int | целое |\n| double | дробное |\n| char | символ |\n| string | строка |","1_1":"## Типы данных\n\nУ каждой переменной — свой тип. `char` хранит один символ и пишется в одинарных кавычках: `'A'`.","1_2":"## Арифметика\n\n`+ - * / %`. Для целых `/` — целая часть, `%` — остаток.","2_0":"## Ввод с клавиатуры\n\n`cin >> переменная;` читает значение с клавиатуры.","2_1":"## Ввод нескольких\n\n`cin >> a >> b;` читает два значения подряд.","3_0":"## if/else\n\n`if(условие){ ... } else { ... }` выбирает ветку. Сравнения: `== != > \u003c >= \u003c=`.","3_1":"## Остаток от деления\n\n`n % 2` — остаток. Если 0 — число чётное.","4_0":"## Цикл for\n\n`for(начало; условие; шаг){ ... }` повторяет код указанное число раз.","4_1":"## Цикл while\n\n`while(условие){ ... }` повторяет, пока условие верно. Не забудь менять счётчик!","5_0":"## Массив\n\n`int a[3] = {7,8,9};` — массив из 3 чисел. Индексация с нуля: `a[0]`.","5_1":"## Сумма элементов\n\nПройди массив циклом и копи в `s` через `s += a[i]`.","6_0":"## Функции\n\n`Тип имя(параметры){ return значение; }` — своя команда.","6_1":"## Параметры\n\nФункция может принимать несколько параметров и возвращать результат через `return`.","7_0":"## Строки\n\n`string` соединяется через `+` или `+=`.","7_1":"## Финальный проект\n\nСобираем всё в одну программу — свой калькулятор."};
let curLesson=0,curTask=0,openLesson=-1,revealed={};
let progress=JSON.parse(localStorage.getItem(P+'_progress')||'{}');
renderSidebar();renderContent();

function stats(){let t=0,d=0;LESSONS.forEach((l,li)=>l.tasks.forEach((x,ti)=>{t++;if(progress[li+'_'+ti])d++}));return{t,d}}
function updateStats(){const{t,d}=stats();const el=document.getElementById('statsText');if(el)el.textContent=d+' / '+t;renderSidebar()}
function syncProgress(){var tok=localStorage.getItem('lingx_token');if(!tok)return;var pr={};try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('sbj_')===0&&k.indexOf('_progress')>0){try{pr[k.replace('_progress','')]=JSON.parse(localStorage.getItem(k))}catch(e){}}}}catch(e){}fetch((typeof API!=='undefined'&&API?API:'/api')+'/me',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tok,progress:pr})}).catch(function(){})}
(function(){setTimeout(syncProgress,1200)})();
function markDone(li,ti){progress[li+'_'+ti]=true;localStorage.setItem(P+'_progress',JSON.stringify(progress));updateStats();syncProgress()}
function renderSidebar(){const el=document.getElementById('lessonList');let h='';LESSONS.forEach((l,li)=>{const ld=l.tasks.filter((x,ti)=>progress[li+'_'+ti]).length;h+='<div class="lgrp"><div class="lgrp-hdr" onclick="toggleLesson('+li+')"><span class="arr '+(openLesson===li?'open':'')+'">▶</span>'+(li+1)+'. '+l.title+'<span class="cnt">'+ld+'/'+l.tasks.length+'</span></div><div class="lgrp-body '+(openLesson===li?'open':'')+'">';l.tasks.forEach((t,ti)=>{h+='<div class="ltask'+(li===curLesson&&ti===curTask?' active':'')+'" data-li="'+li+'" data-ti="'+ti+'" onclick="selectTask('+li+','+ti+')"><span class="dot'+(progress[li+'_'+ti]?' done':'')+'"></span>'+t.name+'</div>'});h+='</div></div>'});el.innerHTML=h}
function isRevealed(li,ti){return revealed[li+'_'+ti]===true}
function selectTask(li,ti){
curLesson=li;curTask=ti;openLesson=li;
document.getElementById('editorPanel').classList.remove('open');
document.querySelectorAll('#lessonList .ltask').forEach(function(el){el.classList.toggle('active',+el.getAttribute('data-li')===li&&+el.getAttribute('data-ti')===ti)});
document.querySelectorAll('#lessonList .lgrp').forEach(function(g,idx){var body=g.querySelector('.lgrp-body'),arr=g.querySelector('.arr'),on=idx===li;if(body)body.classList.toggle('open',on);if(arr)arr.classList.toggle('open',on)});
renderContent()}
function toggleLesson(li){
openLesson=openLesson===li?-1:li;
document.querySelectorAll('#lessonList .lgrp').forEach(function(g,idx){
var body=g.querySelector('.lgrp-body'),arr=g.querySelector('.arr');
var on=idx===openLesson;
if(body)body.classList.toggle('open',on);
if(arr)arr.classList.toggle('open',on);
});
}
function gotIt(li,ti){
revealed[li+'_'+ti]=true;
const g=document.getElementById('gateBox');
if(g)g.innerHTML='<span class="dim">Задание открыто. Пиши код в редакторе ниже 👇</span>';
document.getElementById('editorPanel').classList.add('open');
loadCode();
setTimeout(()=>{const p=document.getElementById('editorPanel');if(p)p.scrollIntoView({behavior:'smooth',block:'start'})},60);
}
function renderContent(){
const c=document.getElementById('content');const l=LESSONS[curLesson];const t=l.tasks[curTask];
let h='<h2>'+l.title+'</h2><div class="task-box"><h4>'+t.name+'</h4><div class="theory">'+renderTheory(THEORY[curLesson+'_'+curTask]||'## Задание\n\nНапиши код, который выводит ожидаемый результат.')+'</div><div class="gate" id="gateBox">';
if(isRevealed(curLesson,curTask)){h+='<span class="dim">Задание открыто. Пиши код в редакторе ниже 👇</span>'}
else{h+='<button class="btn-gotit" onclick="gotIt('+curLesson+','+curTask+')">К заданию →</button>'}
h+='</div></div>';c.innerHTML=h;
document.getElementById('taskLabel').textContent='Задание '+l.title;
document.getElementById('taskTarget').textContent='Нужно вывести: '+t.expect;
if(isRevealed(curLesson,curTask)){document.getElementById('editorPanel').classList.add('open');loadCode()}
}

function getTheory(li,ti){return THEORY[li+'_'+ti]||'## Задание\n\nНапиши код, который выводит ожидаемый результат.'}

function renderTheory(md){
let html='',lines=md.split('\n'),inCode=false,codeLines=[];
let th=[],ta=[],tal=[];
for(let i=0;i<lines.length;i++){const l=lines[i];
if(l.startsWith('```')){if(inCode){html+='<pre><code>'+esc(codeLines.join('\n'))+'</code></pre>';codeLines=[];inCode=false}else inCode=true;continue}
if(inCode){codeLines.push(l);continue}
if(l.startsWith('|')&&l.endsWith('|')){const p=l.split('|').filter(x=>x.trim());if(l.includes('---')){tal=p.map(x=>x.includes(':')?'center':'left');continue}if(!th.length)th=p;else ta.push(p);continue}
else if(th.length){html+=buildT(th,tal,ta);th=[];ta=[]}
if(l.startsWith('## '))html+='<h3>'+l.slice(3)+'</h3>';
else if(l.startsWith('> '))html+='<div class="info">'+inline(l.slice(2))+'</div>';
else if(l.startsWith('- '))html+='<li>'+inline(l.slice(2))+'</li>';
else if(l.trim()==='')html+='<br>';
else html+='<p>'+inline(l)+'</p>';}
if(inCode)html+='<pre><code>'+esc(codeLines.join('\n'))+'</code></pre>';
if(th.length)html+=buildT(th,tal,ta);
return html;
}
function buildT(hd,al,rows){let h='<table><thead><tr>';hd.forEach((c,i)=>{h+='<th style="text-align:'+(al[i]||'left')+'">'+c+'</th>'});h+='</tr></thead><tbody>';rows.forEach(r=>{h+='<tr>';r.forEach((c,i)=>{h+='<td style="text-align:'+(al[i]||'left')+'">'+inline(c)+'</td>'});h+='</tr>'});h+='</tbody></table>';return h}
function inline(t){return String(t).replace(/\`([^`]+)\`/g,'<code>$1</code>')}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

let editor=null;
function loadCode(){
const t=LESSONS[curLesson].tasks[curTask];
if(!editor){editor=CodeMirror.fromTextArea(document.getElementById('codeEditor'),{mode:'python',lineNumbers:true,indentUnit:4,tabSize:4,indentWithTabs:false});editor.setSize('100%','100%')}
editor.setValue(t.code);
const o=document.getElementById('output');o.textContent='// Напиши код и нажми "Проверить"';o.className='out';
const ban=document.getElementById('resBan');
}
function getCode(){return editor?editor.getValue():document.getElementById('codeEditor').value||''}
function normalize(s){return String(s).replace(/\s+$/gm,'').replace(/^\s+/gm,'').replace(/[\r\n]+/g,'\n').trim()}
function runAndCheck(){
const code=getCode();const ban=document.getElementById('resBan');const task=LESSONS[curLesson].tasks[curTask];const out=document.getElementById('output');
if(!ban){return}
ban.className='res-ban';
const text=normalize(code);const exp=normalize(task.expect||'');
out.textContent=(task.show||task.expect||'').replace(/\\n/g,'\n');
if(!text){ban.textContent='Сначала напиши код в редакторе';ban.className='res-ban err';return}
if(!exp||text===exp||code.indexOf(task.expect)>=0){ban.textContent='Отлично! Задание принято.';ban.className='res-ban ok';markDone(curLesson,curTask)}
else{ban.textContent='Почти. Ожидалось:\n'+(task.show||task.expect||'');ban.className='res-ban err'}
}
function builtinRead(x){if(Sk.builtinFiles===undefined||Sk.builtinFiles["files"][x]===undefined)throw new Error("Not found: "+x);return Sk.builtinFiles["files"][x]}
function resetCode(){loadCode();const ban=document.getElementById('resBan');if(ban)ban.className='res-ban'}
function showHint(){const t=LESSONS[curLesson].tasks[curTask];const o=document.getElementById('output');if(o){o.textContent='💡 Подсказка: '+t.hint;o.className='out'}}

function toggleMenu(){document.getElementById('menuOverlay').classList.toggle('open')}
function closeMenu(){document.getElementById('menuOverlay').classList.remove('open')}
function toggleSubmenu(id,el){const body=document.getElementById(id);const arr=el?el.querySelector('.m-arr'):null;body.classList.toggle('open');if(arr)arr.classList.toggle('open')}
updateStats();(function(){var el=document.getElementById('lessonList');if(el){el.classList.add('lgrpAnim');setTimeout(function(){el.classList.remove('lgrpAnim')},900)}})();
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeMenu()});
</script>
</body>
