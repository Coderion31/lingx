<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Геометрия — HarmoniumUIstudy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--accent:#3b82f6;--accent-rgb:59,130,246}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#141416;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column}
.nav-bar{position:fixed;top:16px;right:68px;display:flex;gap:2px;z-index:100;background:rgba(255,255,255,0.04);backdrop-filter:blur(12px);border-radius:22px;border:1px solid rgba(255,255,255,0.06);padding:4px;height:44px}
.nav-bar button{background:transparent;border:none;color:rgba(255,255,255,0.5);padding:8px 14px;cursor:pointer;border-radius:18px;font-size:16px;transition:.3s;display:flex;align-items:center;justify-content:center;height:36px;width:36px}
.nav-bar button:hover{background:rgba(255,255,255,0.08);color:#e0e0e0}
.menu-btn{position:fixed;top:16px;right:16px;width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,0.04);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);cursor:pointer;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.menu-btn:hover{background:rgba(255,255,255,0.08)}
.menu-btn span{display:block;width:18px;height:2px;background:rgba(255,255,255,0.5)}
.menu-overlay{position:fixed;top:12px;left:12px;bottom:12px;width:280px;background:rgba(20,20,22,0.96);backdrop-filter:blur(16px);border-radius:20px;z-index:99;transform:translateX(-110%);transition:transform .35s ease;display:flex;flex-direction:column;padding:80px 16px 16px;border:1px solid rgba(255,255,255,0.06)}
.menu-overlay.open{transform:translateX(0)}
.menu-items{display:flex;flex-direction:column;gap:8px;width:100%}
.menu-items a{color:#a0a0a0;text-decoration:none;font-size:16px;font-weight:500;padding:10px 16px;border-radius:100px;background:rgba(255,255,255,0.02);transition:.3s}
.menu-items a:hover{background:rgba(255,255,255,0.06);color:#e0e0e0}
.m-sub-hdr{display:flex;align-items:center;gap:6px;padding:10px 16px;border-radius:100px;color:#a0a0a0;font-size:16px;font-weight:500;cursor:pointer;transition:.3s}
.m-sub-hdr:hover{background:rgba(255,255,255,0.06);color:#e0e0e0}
.m-arr{font-size:10px;transition:transform .25s;color:rgba(255,255,255,0.3);margin-left:auto}
.m-arr.open{transform:rotate(90deg)}
.m-sub-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.m-sub-body.open{max-height:200px}
.m-sub-body a{padding-left:36px!important;font-size:14px!important;color:rgba(255,255,255,0.5)!important}
.m-sub-body a:hover{color:#e0e0e0!important;background:rgba(255,255,255,0.04)!important}
.m-bottom{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.m-settings{display:flex;align-items:center;justify-content:center;width:100%;padding:12px 16px;border-radius:100px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.04);color:#a0a0a0;cursor:pointer;font-size:14px;font-weight:500;transition:.3s}
.m-settings:hover{background:rgba(255,255,255,0.08);color:#e0e0e0}
.container{display:flex;flex:1;overflow:hidden}
.sidebar{width:220px;background:#1a1a1d;overflow-y:auto;flex-shrink:0;border-right:1px solid rgba(255,255,255,0.04)}
.sidebar-in{padding:10px}
.sidebar h3{color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;padding:0 4px}
.lgrp{margin-bottom:2px}
.lgrp-hdr{cursor:pointer;padding:8px 10px;font-size:13px;font-weight:500;color:#e0e0e0;display:flex;align-items:center;gap:6px;border-radius:6px;transition:.2s}
.lgrp-hdr:hover{background:rgba(255,255,255,0.04)}
.lgrp-hdr .arr{font-size:10px;transition:transform .2s;color:rgba(255,255,255,0.3)}
.lgrp-hdr .arr.open{transform:rotate(90deg)}
.lgrp-hdr .cnt{font-size:10px;color:#6b6b70;margin-left:auto}
.lgrp-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.lgrp-body.open{max-height:400px}
.ltask{cursor:pointer;padding:5px 10px 5px 26px;font-size:12px;color:#6b6b70;border-radius:4px;margin:1px 4px;transition:.2s;display:block}
.ltask:hover{background:rgba(255,255,255,0.04);color:#e0e0e0}
.ltask.active{background:rgba(var(--accent-rgb),0.1);color:var(--accent);font-weight:600}
.ltask .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.1);margin-right:8px;flex-shrink:0}
.ltask .dot.done{background:var(--accent)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.content{flex:1;overflow-y:auto;padding:22px 28px}
.content h2{font-size:20px;font-weight:700;margin-bottom:10px;letter-spacing:-.3px}
.content h3{color:var(--accent);font-size:15px;margin:16px 0 6px}
.content p{line-height:1.7;margin:6px 0;color:#a0a0a0;font-size:14px}
.content .info{background:rgba(var(--accent-rgb),0.06);border-left:3px solid var(--accent);padding:12px 16px;margin:10px 0;border-radius:0 8px 8px 0;font-size:14px;color:#c0c0c0}
.task-box{border:1px solid rgba(255,255,255,0.06);background:#1a1a1d;padding:16px 20px;border-radius:10px;margin:14px 0}
.task-box h4{color:var(--accent);font-size:15px;margin-bottom:8px}
.task-box .q{color:#a0a0a0;font-size:14px;margin-bottom:12px;line-height:1.5}
.task-box input[type=text]{width:100%;padding:9px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:#141416;color:#e0e0e0;font-size:14px;outline:none;margin-bottom:10px}
.task-box input[type=text]:focus{border-color:var(--accent)}
.task-box .btn{padding:8px 18px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;font-size:13px;transition:.2s;font-weight:500;margin-right:8px}
.task-box .btn:hover{background:var(--accent);color:#141416}
.task-box .res{margin-top:10px;font-size:13px;display:none;padding:10px 14px;border-radius:6px}
.task-box .res.ok{display:block;background:rgba(var(--accent-rgb),0.1);color:var(--accent);border:1px solid var(--accent)}
.task-box .res.bad{display:block;background:rgba(229,83,75,0.1);color:#e5534b;border:1px solid #e5534b}
.footer{text-align:center;padding:16px;color:#6b6b70;font-size:12px;border-top:1px solid rgba(255,255,255,0.04)}

.task-box{border-radius:20px}.task-box input[type=text]{border-radius:12px}.task-box .btn{border-radius:999px}.lgrp-hdr{border-radius:10px}.ltask{border-radius:8px}.content pre{border-radius:12px}.content .info{border-radius:10px}.menu-overlay{transform:translateX(-110%)!important;opacity:0!important;transition:transform .42s cubic-bezier(.16,1,.3,1),opacity .35s ease!important}.menu-overlay.open{transform:translateX(0)!important;opacity:1!important}.menu-overlay .menu-items>*{opacity:0;transform:translateX(-14px)}.menu-overlay.open .menu-items>*{opacity:1;transform:none;transition:opacity .3s ease,transform .3s ease}.menu-overlay.open .menu-items>*:nth-child(1){transition-delay:.05s}.menu-overlay.open .menu-items>*:nth-child(2){transition-delay:.09s}.menu-overlay.open .menu-items>*:nth-child(3){transition-delay:.13s}.menu-overlay.open .menu-items>*:nth-child(4){transition-delay:.17s}.menu-overlay.open .menu-items>*:nth-child(5){transition-delay:.21s}.menu-overlay.open .menu-items>*:nth-child(6){transition-delay:.25s}.menu-overlay.open .menu-items>*:nth-child(7){transition-delay:.29s}.menu-overlay.open .menu-items>*:nth-child(8){transition-delay:.33s}.menu-overlay.open .menu-items>*:nth-child(9){transition-delay:.37s}.menu-overlay.open .menu-items>*:nth-child(10){transition-delay:.41s}.nav-bar{background:rgba(127,127,127,0.16)!important;border:1px solid rgba(127,127,127,0.28)!important}.nav-bar button{color:#8a8a8a!important}.nav-bar button:hover{background:rgba(127,127,127,0.22)!important;color:#5a5a5a!important}.menu-btn{background:rgba(127,127,127,0.16)!important;border:1px solid rgba(127,127,127,0.28)!important}.menu-btn:hover{background:rgba(127,127,127,0.26)!important}.menu-btn span{background:#8a8a8a!important}.light body{background:#eaeff3;color:#1e293b}.light .sidebar{background:#f4f6f9;border-right:1px solid rgba(15,23,42,0.06)}.light .sidebar h3{color:var(--accent)}.light .lgrp-hdr{color:#1e293b}.light .lgrp-hdr:hover{background:rgba(15,23,42,0.05)}.light .lgrp-hdr .cnt{color:#94a3b8}.light .ltask{color:#64748b}.light .ltask:hover{background:rgba(15,23,42,0.05);color:#1e293b}.light .ltask .dot{background:rgba(15,23,42,0.14)}.light .container .main .content h2{color:#0f172a}.light .content h2{color:#0f172a}.light .content h3{color:var(--accent)}.light .content p{color:#475569}.light .content li{color:#475569}.light .content code{color:var(--accent);background:rgba(15,23,42,0.05)}.light .content pre{background:#eaeff3;border:1px solid rgba(15,23,42,0.12);color:#1e293b}.light .content th{background:#f1f5f9;color:var(--accent);border-color:rgba(15,23,42,0.08)}.light .content td{color:#475569;border-color:rgba(15,23,42,0.06)}.light .content .info{background:rgba(59,130,246,0.06);color:#334155}.light .task-box{background:#f4f6f9;border:1px solid rgba(15,23,42,0.08)}.light .task-box .q{color:#475569}.light .task-box input[type=text]{background:#f4f6f9;border:1px solid rgba(15,23,42,0.16);color:#1e293b}.light .footer{color:#94a3b8;border-top:1px solid rgba(15,23,42,0.06)}.light .nav-bar{background:rgba(200,200,210,0.55)!important;border:1px solid rgba(120,120,130,0.3)!important}.light .nav-bar button{color:#48484e!important}.light .nav-bar button:hover{background:rgba(120,120,130,0.2)!important;color:#1a1a1e!important}.light .menu-btn{background:rgba(200,200,210,0.55)!important;border:1px solid rgba(120,120,130,0.3)!important}.light .menu-btn:hover{background:rgba(190,190,200,0.7)!important}.light .menu-btn span{background:#48484e!important}.light .menu-overlay{background:rgba(240,244,248,0.97);border-color:rgba(15,23,42,0.08)}.light .menu-items a{background:rgba(15,23,42,0.03);color:#475569}.light .menu-items a:hover{background:rgba(15,23,42,0.06);color:#1e293b}.light .m-sub-hdr{background:rgba(15,23,42,0.03);color:#475569}.light .m-sub-hdr:hover{background:rgba(15,23,42,0.06);color:#1e293b}.light .m-arr{color:rgba(15,23,42,0.4)}.light .m-sub-body a{color:#64748b!important}.light .m-sub-body a:hover{color:#1e293b!important;background:rgba(15,23,42,0.04)!important}.light .m-settings{background:rgba(15,23,42,0.03);border:1px solid rgba(15,23,42,0.08);color:#475569}.light .m-settings:hover{background:rgba(15,23,42,0.06);color:#1e293b}.light .editor-panel{background:#f4f6f9;border-top:2px solid var(--accent)}.light .er-col textarea{background:#f4f6f9;border:1px solid rgba(15,23,42,0.16);color:#1e293b}.light .out{background:#eaeff3;border:1px solid rgba(15,23,42,0.12);color:#334155}.light .CodeMirror{background:#f4f6f9!important;color:#1e293b!important;border:1px solid rgba(15,23,42,0.12)}.light .CodeMirror-gutters{background:#f4f6f9!important;border-right:1px solid rgba(15,23,42,0.06)!important}.menu-overlay{overflow:hidden}.menu-items{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:thin}.menu-items .m-sub-body a{background:rgba(255,255,255,0.04)!important;border-radius:999px;padding:10px 16px 10px 32px;margin:1px 6px;font-size:14px;color:#a0a0a0!important;font-weight:500;display:block}.menu-items .m-sub-body a:hover{background:rgba(255,255,255,0.06)!important;color:#e0e0e0!important}.light .menu-items .m-sub-body a{background:rgba(15,23,42,0.05)!important;color:#475569!important}.light .menu-items .m-sub-body a:hover{background:rgba(15,23,42,0.06)!important;color:#0f172a!important}.menu-items .m-sub-hdr{background:rgba(255,255,255,0.04)!important;color:#a0a0a0!important}.menu-items .m-sub-hdr:hover{background:rgba(255,255,255,0.08)!important;color:#e0e0e0!important}.light .menu-items .m-sub-hdr{background:rgba(15,23,42,0.05)!important;color:#475569!important}.light .menu-items .m-sub-hdr:hover{background:rgba(15,23,42,0.08)!important;color:#1e293b!important}</style><script>(function(){function hx(rgb){return '#'+rgb.map(function(x){x=Math.max(0,Math.min(255,Math.round(x)));return('0'+x.toString(16)).slice(-2)}).join('')}try{var c=localStorage.getItem('lingx_color')||'#3b82f6';if(!/^#[0-9a-fA-F]{6}$/.test(c))c='#3b82f6';var r=parseInt(c.substr(1,2),16),g=parseInt(c.substr(3,2),16),b=parseInt(c.substr(5,2),16);var d=document.documentElement;d.style.setProperty('--accent',c);d.style.setProperty('--accent-rgb',r+','+g+','+b);d.style.setProperty('--accent2',hx([r*0.8,g*0.8,b*0.8]))}catch(e){}})();</script><script>(function(){try{if(localStorage.getItem('lingx_theme')==='light'){document.documentElement.classList.add('light')}}catch(e){}})();</script></head>

<div class="container">
<div class="sidebar"><div class="sidebar-in">
<h3>Уроки</h3>
<div id="lessonList"></div>
<div style="margin-top:12px"><h3>Статистика</h3><div style="font-size:11px;color:#6b6b70" id="statsText">0 / 0</div></div>
</div></div>

<div class="content" id="content"></div>
</div>
</div>
<footer class="footer">HarmoniumUIstudy 2026</footer>
<script>
const P='sbj_geometry';
const LESSONS=[{"title": "Основы геометрии", "tasks": [{"name": "Точки и прямые", "theory": "<p>Через две точки — одна прямая. Отрезок — часть прямой.</p>", "q": "Сколько прямых через одну точку?", "ans": "много"}, {"name": "Углы", "theory": "<p>Острый < 90°, прямой = 90°, тупой > 90°, развёрнутый = 180°.</p>", "q": "Сумма смежных углов?", "ans": "180"}]}];
let curLesson=0,curTask=0;
let progress=JSON.parse(localStorage.getItem(P+'_progress')||'{}');
let openLesson=-1;
renderSidebar();renderContent();

function stats(){let t=0,d=0;LESSONS.forEach((l,li)=>l.tasks.forEach((x,ti)=>{t++;if(progress[li+'_'+ti])d++}));return{t,d}}
function updateStats(){const{t,d}=stats();document.getElementById('statsText').textContent=d+' / '+t;renderSidebar()}
function markDone(li,ti){progress[li+'_'+ti]=true;localStorage.setItem(P+'_progress',JSON.stringify(progress));updateStats()}
function renderSidebar(){const el=document.getElementById('lessonList');let h='';LESSONS.forEach((l,li)=>{const ld=l.tasks.filter((x,ti)=>progress[li+'_'+ti]).length;h+='<div class="lgrp"><div class="lgrp-hdr" onclick="toggleLesson('+li+')"><span class="arr '+(openLesson===li?'open':'')+'">▶</span>'+(li+1)+'. '+l.title+'<span class="cnt">'+ld+'/'+l.tasks.length+'</span></div><div class="lgrp-body '+(openLesson===li?'open':'')+'">';l.tasks.forEach((t,ti)=>{h+='<div class="ltask'+(li===curLesson&&ti===curTask?' active':'')+'" onclick="selectTask('+li+','+ti+')"><span class="dot'+(progress[li+'_'+ti]?' done':'')+'"></span>'+t.name+'</div>'});h+='</div></div>'});el.innerHTML=h}
function toggleLesson(li){openLesson=openLesson===li?-1:li;renderSidebar()}
function selectTask(li,ti){curLesson=li;curTask=ti;openLesson=li;renderSidebar();renderContent()}
function checkAnswer(li,ti,ans){
const t=LESSONS[li].tasks[ti];
const inp=document.getElementById('ans_'+li+'_'+ti);
const res=document.getElementById('res_'+li+'_'+ti);
const val=inp?inp.value.trim().toLowerCase():'';
if(val===String(ans).toLowerCase()){markDone(li,ti);res.className='res ok'}
else{res.className='res bad';res.textContent='Неверно, попробуй ещё'}
}
function renderContent(){const c=document.getElementById('content');const l=LESSONS[curLesson];const t=l.tasks[curTask];let h='<h2>'+l.title+'</h2><div class="task-box"><h4>'+t.name+'</h4>';if(t.theory)h+=t.theory;h+=t.q?'<div class="q">'+t.q+'</div>':'';h+='<input type="text" id="ans_'+curLesson+'_'+curTask+'" placeholder="Твой ответ">';h+='<button class="btn" onclick="checkAnswer('+curLesson+','+curTask+',\''+t.ans+'\')">Проверить</button><div class="res" id="res_'+curLesson+'_'+curTask+'"></div></div>';c.innerHTML=h;if(progress[curLesson+'_'+curTask]){document.getElementById('ans_'+curLesson+'_'+curTask).disabled=true;document.getElementById('res_'+curLesson+'_'+curTask).className='res ok';document.getElementById('res_'+curLesson+'_'+curTask).textContent='Задание выполнено'}}

function toggleMenu(){document.getElementById('menuOverlay').classList.toggle('open')}
function closeMenu(){document.getElementById('menuOverlay').classList.remove('open')}
function toggleSubmenu(id,el){
const body=document.getElementById(id);const arr=el?el.querySelector('.m-arr'):null;
body.classList.toggle('open');if(arr)arr.classList.toggle('open')
}
updateStats();
</script>
</body>
