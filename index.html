const lessons = [
{
title:'Введение в Python',
theory:`# Введение в Python

Python — это язык программирования. Его придумали, чтобы людям было **легко** отдавать команды компьютеру.

## Почему Python — лучший для начала?
- **Просто читать** — код похож на английские предложения
- **Можно сразу играть** — написал 1 строчку — уже видишь результат
- **Всё понятно** — не нужно знать сложные штуки

## Твоя первая программа

Напиши это и нажми "Запустить":

\`\`\`python
print("Привет, мир!")
\`\`\`

\`print\` — это команда "напечатай". Computer напечатает то, что в скобках. Текст нужно брать в кавычки — это как упаковка для слов.

## Это как?
Представь, что Python — это робот, который понимает только английские команды. Ты говоришь ему \`print("...") \` — и он говорит это вслух.

## Попробуй сам
Напиши, что хочешь сказать миру, внутри \`print()\`.`,
exercise:'**Задание 1.** Напиши программу, которая выводит твоё любимое слово.\n\n**Задание 2.** (сложнее) Выведи **две** разные фразы в двух строчках. Подсказка: print() два раза.',
starter:'# Напиши print со своим любимым словом\n',
expected:'',
hint:'print("твоё слово") — не забудь кавычки!'
},
{
title:'Переменные',
theory:`# Переменные

Переменная — это **коробка с именем**, в которую можно положить значение.

\`\`\`python
name = "Аня"      # положили слово "Аня" в коробку name
age = 10           # положили число 10 в коробку age
\`\`\`

Знак \`=\` здесь не "равно", а "положи в коробку".

## Как назвать коробку?
- Используй английские буквы
- Не начинай с цифры
- Называй понятно: \`player_name\`, \`score\`, \`my_age\`

## Что лежит в коробке? (типы)
- "текст" — это **строка** (\`str\`). Всегда в кавычках.
- \`5\`, \`-3\`, \`100\` — это **число** (\`int\`). Без кавычек.
- \`3.14\`, \`0.5\` — это **дробное число** (\`float\`).

## Используем коробку
\`\`\`python
name = "Макс"
age = 10
print("Меня зовут", name)
print("Мне", age, "лет")
\`\`\`

Заметь: запятая \` , \` ставит пробел между словами.`,
exercise:'**Задание 1.** Создай переменную \`pet\` с именем твоего питомца (или любым животным) и выведи "Мой питомец — ...".\n\n**Задание 2.** Создай переменную \`year\` с годом, в котором ты родился, и выведи "Я родился в ... году".',
starter:'pet = "Барсик"\n# Выведи\n',
expected:'',
hint:'Сначала pet = "имя", потом print("Мой питомец —", pet)'
},
{
title:'Математика и числа',
theory:`# Математика в Python

Python умеет считать! Это его суперсила.

## Действия с числами
\`\`\`python
print(5 + 3)   # 8 — сложение
print(10 - 4)  # 6 — вычитание
print(3 * 5)   # 15 — умножение
print(15 / 3)  # 5.0 — деление (всегда даёт дробное)
\`\`\`

## Хитрые значки
| Действие | Знак | Пример | Результат |
|----------|------|--------|-----------|
| Сложить | \`+\` | \`5 + 2\` | \`7\` |
| Вычесть | \`-\` | \`10 - 3\` | \`7\` |
| Умножить | \`*\` | \`4 * 3\` | \`12\` |
| Разделить | \`/\` | \`9 / 2\` | \`4.5\` |
| Целая часть деления | \`//\` | \`9 // 2\` | \`4\` |
| Остаток от деления | \`%\` | \`9 % 2\` | \`1\` |

## Это как?
\`9 // 2 = 4\` — сколько раз 2 помещается в 9? 4 раза.
\`9 % 2 = 1\` — и ещё 1 остался (остаток).

## Считаем с переменными
\`\`\`python
a = 10
b = 3
print(a + b)   # 13
print(a // b)  # 3 (сколько троек в десятке)
print(a % b)   # 1 (остаток)
\`\`\``,
exercise:'**Задание 1.** Напиши код, который считает, сколько будет 7 умножить на 8.\n\n**Задание 2.** У тебя есть 17 конфет и 5 друзей. Сколько конфет достанется каждому поровну (целых)? А сколько останется? Используй \`//\` и \`%\`.',
starter:'print(7 * 8)\n# Теперь конфеты:\ntotal = 17\nfriends = 5\n',
expected:'',
hint:'Каждому: total // friends, останется: total % friends'
},
{
title:'Сравнения и if',
theory:`# Условия (if) — это выбор

Компьютер может **думать** и выбирать, что делать, с помощью \`if\`.

\`\`\`python
age = 12
if age >= 18:
    print("Ты взрослый!")
else:
    print("Ты ребёнок")
\`\`\`

## Правила
- После \`if\` ставим \`:\`
- Следующую строчку начинаем с **4 пробелов** (или Tab)
- \`else\` — "иначе" — что делать, если условие НЕ сработало
- \`elif\` — "иначе если" — когда нужно много вариантов

## Знаки сравнения
| Знак | Значение |
|------|----------|
| \`==\` | равно |
| \`!=\` | не равно |
| \`>\` | больше |
| \`<\` | меньше |
| \`>=\` | больше или равно |
| \`<=\` | меньше или равно |

## Пример с elif
\`\`\`python
mark = 85
if mark >= 90:
    print("Вау! Отлично!")
elif mark >= 70:
    print("Хорошо, молодец!")
elif mark >= 50:
    print("Нормально, но можно лучше")
else:
    print("Нужно подтянуть")
\`\`\``,
exercise:'**Задание 1.** Напиши код: если число \`x\` > 0, выведи "Плюс", если меньше 0 — "Минус", если ровно 0 — "Ноль".\n\n**Задание 2.** Возраст \`age\`. Если меньше 7 — "Садик", от 7 до 17 — "Школа", от 18 — "Взрослая жизнь".',
starter:'x = 0\n# Напиши if-elif-else\n',
expected:'',
hint:'if x > 0: ... elif x < 0: ... else: ...'
},
{
title:'Цикл for — повторялки',
theory:`# Цикл for — делаем много раз

Цикл — это когда одна команда выполняется **снова и снова**.

## Перебираем список
\`\`\`python
fruits = ["яблоко", "банан", "вишня"]
for f in fruits:
    print(f)
\`\`\`

Компьютер берёт каждый фрукт по очереди и \`print\` его.

## range() — числовая линейка
\`\`\`python
for i in range(5):     # 0, 1, 2, 3, 4
    print(i)

for i in range(2, 6):  # 2, 3, 4, 5
    print(i)

for i in range(0, 10, 2):  # 0, 2, 4, 6, 8 (шаг 2)
    print(i)
\`\`\`

\`range(начало, конец, шаг)\`
- Начало — откуда начать
- Конец — где **остановиться** (не включая его!)
- Шаг — через сколько прыгать

## Это как
Представь, что ты раздаёшь листовки на улице. Ты берёшь одну → отдаёшь → берёшь следующую → отдаёшь... Вот это и есть цикл!`,
exercise:'**Задание 1.** Выведи все чётные числа от 0 до 20 (с шагом 2).\n\n**Задание 2.** Выведи таблицу умножения для числа 5: "5 x 1 = 5", "5 x 2 = 10"... до 5 x 10. Подсказка: \`for i in range(1, 11):\`',
starter:'# Задание 1\nfor i in range(0, 21, 2):\n    print(i)\n',
expected:'',
hint:'Для таблицы: print(f"5 x {i} = {5*i}") или print("5 x", i, "=", 5*i)'
},
{
title:'Списки — коллекции',
theory:`# Списки (list) — твои коллекции

Список — это **набор вещей** в квадратных скобках.

\`\`\`python
toys = ["лего", "кукла", "машинка"]
print(toys[0])   # лего — первый элемент!
print(toys[1])   # кукла
print(toys[2])   # машинка
\`\`\`

**Важно:** счёт начинается с 0, а не с 1!
\`toys[0]\` — первая игрушка, \`toys[1]\` — вторая.

## Отрицательные индексы
\`\`\`python
print(toys[-1])  # машинка — последняя
print(toys[-2])  # кукла
\`\`\`

## Методы — что можно делать со списком
\`\`\`python
toys.append("робот")      # добавить в конец
toys.insert(1, "мяч")     # вставить на место 1
toys.remove("кукла")      # удалить по имени
print(len(toys))          # сколько всего игрушек
\`\`\`

## Перебираем список циклом
\`\`\`python
for toy in toys:
    print("У меня есть", toy)
\`\`\``,
exercise:'**Задание 1.** Создай список из 3 своих любимых игр. Добавь четвёртую через \`.append()\`. Выведи весь список.\n\n**Задание 2.** (сложнее) Выведи каждую игру с номером: "Игра №1: Minecraft". Используй цикл \`for\` и \`enumerate()\` или счётчик.',
starter:'games = ["Minecraft", "Roblox", "Terraria"]\n# Добавь и выведи\n',
expected:'',
hint:'games.append("Stardew Valley")\nfor g in games: print(g)'
},
{
title:'Словари',
theory:`# Словари (dict) — коробки с ярлыками

Список хорош, но как запомнить, что где лежит? Для этого есть **словарь** — вещь + ярлык.

\`\`\`python
me = {
    "name": "Дима",
    "age": 10,
    "hobby": "рисование"
}
print(me["name"])   # Дима
print(me["hobby"])  # рисование
\`\`\`

Словарь — это \`{ }\` с парами \`ключ: значение\`.

## Это как гардероб
Ключ — это номерок, по которому ты находишь свою вещь. \`me["name"]\` — дай мне то, что подписано "name".

## Можно менять
\`\`\`python
me["age"] = 11     # изменили возраст
me["city"] = "Москва"  # добавили новый ключ
\`\`\`

## Перебираем словарь
\`\`\`python
for key in me:
    print(key, ":", me[key])
\`\`\``,
exercise:'**Задание 1.** Создай словарь про себя: имя, возраст, любимый цвет. Выведи любимый цвет.\n\n**Задание 2.** Добавь в словарь любимую еду. Выведи всё через цикл \`for\`.',
starter:'me = {\n    "name": "Твоё имя",\n    "age": 10,\n    "color": "синий"\n}\n# Выведи любимый цвет\n',
expected:'',
hint:'print(me["color"])\nme["food"] = "пицца"'
},
{
title:'Функции — твои собственные команды',
theory:`# Функции (def) — создаём свои команды

Функция — это **твоя собственная команда** для компьютера. Ты её один раз создаёшь — и можешь вызывать сколько хочешь!

\`\`\`python
def say_hello():
    print("Привет!")
    print("Как дела?")

# Теперь вызываем:
say_hello()
say_hello()  # снова!
\`\`\`

## Функция с параметром
Можно передавать в функцию разные данные:

\`\`\`python
def greet(name):
    print("Привет,", name, "!")

greet("Аня")
greet("Макс")
\`\`\`

## Функция с return (возвращает результат)
\`\`\`python
def double(x):
    return x * 2

result = double(5)  # result = 10
print(result)
\`\`\`

\`return\` — это "верни результат обратно". Как в магазине: ты даёшь деньги (5), тебе дают сдачу (10).

## Зачем это нужно?
- Не писать одно и то же 100 раз
- Код становится чище
- Можно собирать программы как из кубиков`,
exercise:'**Задание 1.** Напиши функцию \`square(x)\`, которая возвращает x в квадрате. Выведи \`square(7)\`.\n\n**Задание 2.** Напиши функцию \`sum_range(a, b)\`, которая считает сумму всех чисел от a до b. Подсказка: используй цикл \`for\` внутри функции.',
starter:'def square(x):\n    return x * x\n\nprint(square(7))\n\n# Задание 2\n',
expected:'',
hint:'def sum_range(a, b):\n    total = 0\n    for i in range(a, b+1):\n        total += i\n    return total'
}
];

let currentLesson = 0;
let defaultCodes = lessons.map(l => l.starter);

function renderLessons() {
const list = document.getElementById('lessonList');
list.innerHTML = lessons.map((l,i) =>
`<div class="lesson${i===currentLesson?' active':''}" onclick="selectLesson(${i})">${i+1}. ${l.title}</div>`
).join('');
}

function goHome() {
selectLesson(0);
}

function selectLesson(i) {
currentLesson = i;
document.querySelectorAll('.lesson').forEach((el,idx) => el.className='lesson'+(idx===i?' active':''));
renderContent();
document.getElementById('codeEditor').value = lessons[i].starter;
document.getElementById('output').textContent = '// Результат появится здесь';
document.getElementById('headerBread').textContent = 'Урок ' + (i+1) + ' — ' + lessons[i].title;
}

function renderContent() {
const el = document.getElementById('content');
const l = lessons[currentLesson];
// Render markdown-like theory
let html = `<h2>${l.title}</h2>`;
html += renderTheory(l.theory);
html += `<div class="exercise"><h4>Упражнение ${currentLesson+1}</h4><p>${l.exercise}</p></div>`;
el.innerHTML = html;
}

function renderTheory(md) {
let html = '';
let lines = md.split('\n');
let inCode = false;
let codeLines = [];
let inTable = false;
let tableHeaders = [];
let tableAlign = [];
let tableRows = [];

for (let i = 0; i < lines.length; i++) {
const line = lines[i];

if (line.startsWith('```')) {
if (inCode) {
html += '<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>';
codeLines = [];
inCode = false;
} else {
inCode = true;
}
continue;
}
if (inCode) {
codeLines.push(line);
continue;
}

// Tables
if (line.startsWith('|') && line.endsWith('|')) {
const parts = line.split('|').filter(p => p.trim());
if (line.includes('---')) {
tableAlign = parts.map(p => p.includes(':') ? 'center' : 'left');
continue;
}
if (tableHeaders.length === 0) {
tableHeaders = parts;
} else {
tableRows.push(parts);
}
continue;
} else if (tableHeaders.length) {
html += buildTable(tableHeaders, tableAlign, tableRows);
tableHeaders = []; tableRows = [];
}

if (line.startsWith('# ')) { html += `<h2>${line.slice(2)}</h2>`; }
else if (line.startsWith('## ')) { html += `<h3>${line.slice(3)}</h3>`; }
else if (line.startsWith('### ')) { html += `<h4 style="color:#2563eb;margin:12px 0 6px">${line.slice(4)}</h4>`; }
else if (line.startsWith('- ')) { html += `<li style="margin:3px 0;color:#475569">${inlineCode(line.slice(2))}</li>`; }
else if (line.startsWith('| ')) { /* already handled above */ }
else if (line.trim() === '') { html += '<br>'; }
else if (line.startsWith('*') && line.endsWith('*')) { html += `<p><em>${inlineCode(line.slice(1,-1))}</em></p>`; }
else { html += `<p>${inlineCode(line)}</p>`; }
}
if (inCode) html += '<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>';
if (tableHeaders.length) html += buildTable(tableHeaders, tableAlign, tableRows);
return html;
}

function buildTable(headers, align, rows) {
let h = '<table style="width:100%;border-collapse:collapse;margin:10px 0;font-size:13px">';
h += '<thead><tr>';
headers.forEach((c,i) => {
h += `<th style="border:1px solid #e2e8f0;padding:8px;background:#f1f5f9;color:#2563eb;text-align:${align[i]||'left'}">${c}</th>`;
});
h += '</tr></thead><tbody>';
rows.forEach(r => {
h += '<tr>';
r.forEach((c,i) => {
h += `<td style="border:1px solid #e2e8f0;padding:8px;color:#475569;text-align:${align[i]||'left'}">${inlineCode(c)}</td>`;
});
h += '</tr>';
});
h += '</tbody></table>';
return h;
}

function inlineCode(text) {
return text.replace(/\`([^`]+)\`/g, '<code style="background:#f1f5f9;padding:2px 6px;border-radius:4px;color:#2563eb;font-size:13px">$1</code>');
}

function escapeHtml(s) {
return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// --- Skulpt runner ---
function outf(text) {
const out = document.getElementById('output');
out.textContent += text;
}

function builtinRead(x) {
if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined)
throw new Error("File not found: " + x);
return Sk.builtinFiles["files"][x];
}

function runCode() {
const code = document.getElementById('codeEditor').value;
const out = document.getElementById('output');
out.textContent = '';
out.className = 'output';

Sk.configure({output:outf, read:builtinRead, __future__:Sk.python3});
try {
Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>", false, code, {syntaxerrors:"python3"})).then(() => {
if (out.textContent === '') out.textContent = '✓ Код выполнен успешно (нет вывода)';
out.className = 'output success';
}).catch(err => {
out.textContent = err.toString();
out.className = 'output error';
});
} catch(e) {
out.textContent = e.toString();
out.className = 'output error';
}
}

function resetCode() {
document.getElementById('codeEditor').value = lessons[currentLesson].starter;
document.getElementById('output').textContent = '// Результат появится здесь';
document.getElementById('output').className = 'output';
}

function showHint() {
const out = document.getElementById('output');
out.textContent = '💡 Подсказка: ' + lessons[currentLesson].hint;
out.className = 'output';
}

// Init
renderLessons();
renderContent();
document.getElementById('codeEditor').value = lessons[0].starter;
document.getElementById('headerBread').textContent = 'Урок 1 — ' + lessons[0].title;
</script>
