<style>
:root{--bg:#f0f4f8;--card:#fff;--text:#1a202c;--text2:#4a5568;--border:#e2e8f0;--hover:#edf2f7;--active:#ebf4ff;--accent:#3182ce;--accent2:#2b6cb0;--ok:#38a169;--okbg:#f0fff4;--err:#e53e3e;--errbg:#fff5f5;--code-bg:#edf2f7;--shadow:rgba(0,0,0,0.05);--editor-bg:#f7fafc;--header-bg:#fff}
.dark{--bg:#0f1419;--card:#1a2332;--text:#e2e8f0;--text2:#94a3b8;--border:#2d3a4a;--hover:#1e293b;--active:#1e3a5f;--accent:#60a5fa;--accent2:#3b82f6;--ok:#48bb78;--okbg:#1a2e1a;--err:#fc8181;--errbg:#2e1a1a;--code-bg:#1a2332;--shadow:rgba(0,0,0,0.3);--editor-bg:#1a2332;--header-bg:#1a2332}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh;transition:background .3s,color .3s}
header{background:var(--header-bg);padding:0 16px;border-bottom:2px solid var(--border);display:flex;align-items:center;gap:10px;height:50px;flex-shrink:0;transition:background .3s}
.h-logo{width:24px;height:24px;flex-shrink:0}
.h-title{font-size:16px;font-weight:700;color:var(--accent);cursor:pointer;flex-shrink:0;letter-spacing:-.3px}
.h-div{color:var(--text2);font-size:13px;flex-shrink:0}
.h-bread{font-size:11px;color:var(--text2);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0}
.h-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:3px 8px;border-radius:5px;cursor:pointer;font-size:11px;transition:.2s;white-space:nowrap}
.h-btn:hover{background:var(--hover);color:var(--text)}
.av{background:var(--accent);color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;cursor:pointer;flex-shrink:0}
.em{font-size:11px;color:var(--text2);max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr{width:100%;height:4px;background:var(--border);border-radius:2px;overflow:hidden;flex-shrink:0}
.pr-bar{height:100%;background:var(--accent);transition:width .5s;border-radius:2px}
.container{display:flex;flex:1;overflow:hidden}
.sidebar{width:220px;background:var(--card);overflow-y:auto;flex-shrink:0;border-right:1px solid var(--border);transition:background .3s}
.sidebar-in{padding:10px 12px}
.sidebar h3{color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;padding:0 4px}
.lesson{cursor:pointer;padding:7px 10px;margin:2px 0;border-radius:5px;font-size:12px;border-left:3px solid transparent;color:var(--text2);transition:.2s}
.lesson:hover{background:var(--hover)}
.lesson.active{background:var(--active);border-left-color:var(--accent);color:var(--accent);font-weight:600}
.lesson .cnt{font-size:10px;color:var(--text2);opacity:.7}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.content{flex:1;overflow-y:auto;padding:18px 22px}
.content h2{color:var(--text);font-size:18px;margin-bottom:8px}
.content h3{color:var(--accent);font-size:14px;margin:12px 0 5px}
.content p{line-height:1.65;margin:5px 0;color:var(--text2);font-size:14px}
.content pre{background:var(--code-bg);padding:10px 12px;border-radius:6px;overflow-x:auto;margin:6px 0;border:1px solid var(--border);font-size:13px;transition:background .3s}
.content code{color:var(--accent);font-size:13px}
.content .info{background:var(--active);border-left:3px solid var(--accent);padding:10px 14px;margin:8px 0;border-radius:0 6px 6px 0;font-size:13px;color:var(--text2)}
.task-bar{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.tb{padding:4px 10px;border-radius:4px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;font-size:11px;transition:.2s}
.tb:hover{border-color:var(--accent);color:var(--accent)}
.tb.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tb.done{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.task-box{background:var(--card);border:1px solid var(--accent);padding:12px 14px;border-radius:8px;margin:10px 0;transition:background .3s}
.task-box h4{color:var(--accent);font-size:14px;margin-bottom:8px}
.result-banner{padding:8px 14px;border-radius:6px;margin:8px 0;font-size:13px;font-weight:600;display:none}
.result-banner.ok{display:block;background:var(--okbg);color:var(--ok);border:1px solid var(--ok)}
.result-banner.err{display:block;background:var(--errbg);color:var(--err);border:1px solid var(--err)}
.result-banner.ok::before{content:'✓ '}
.result-banner.err::before{content:'✗ '}
.editor-panel{background:var(--card);border-top:2px solid var(--border);padding:10px 15px;flex-shrink:0;transition:background .3s}
.er-bar{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.er-bar label{color:var(--accent);font-size:12px;font-weight:600}
.er-row{display:flex;gap:10px;min-height:200px}
.er-col{flex:1;display:flex;flex-direction:column}
.er-col textarea{flex:1;background:var(--editor-bg);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:10px;font-family:'Consolas','Courier New',monospace;font-size:13px;resize:vertical;min-height:180px;tab-size:4;outline:none;transition:background .3s,color .3s}
.er-col textarea:focus{border-color:var(--accent)}
.out{flex:1;background:var(--editor-bg);border:1px solid var(--border);border-radius:5px;padding:10px;font-family:'Consolas','Courier New',monospace;font-size:13px;overflow:auto;white-space:pre-wrap;min-height:180px;color:var(--text2);transition:background .3s,color .3s}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border-radius:12px;padding:24px;width:340px;box-shadow:0 10px 40px var(--shadow);transition:background .3s}
.modal h2{font-size:17px;margin-bottom:4px;color:var(--text)}
.modal p{font-size:12px;color:var(--text2);margin-bottom:14px}
.modal input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:5px;font-size:14px;background:var(--editor-bg);color:var(--text);outline:none}
.modal input:focus{border-color:var(--accent)}
.modal .btn{width:100%;margin-top:10px;padding:9px;font-size:13px}
.modal .merr{color:var(--err);font-size:12px;margin-top:6px;display:none}
.btn{background:var(--accent);color:#fff;border:none;padding:5px 14px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;transition:.2s}
.btn:hover{background:var(--accent2)}
.btn.outline{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.btn.outline:hover{background:var(--accent);color:#fff}
.btn.sm{padding:4px 10px;font-size:11px}
.btn.ok{background:var(--ok);color:#fff}
.btn.ok:hover{opacity:.9}
@media(max-width:768px){.container{flex-direction:column}.sidebar{width:100%;max-height:150px}.er-row{flex-direction:column}.h-bread{display:none}}
</style>

<script>
// ====== LESSONS ======
const lessons = [
{title:"Основы print()",icon:"1",tasks:[
{name:"Привет, мир!",theory:`## Твой первый код

Python — язык, на котором ты говоришь компьютеру, что делать.

**print()** — команда "напечатай". Компьютер выводит на экран то, что внутри скобок.

\`\`\`python
print("Привет, мир!")
\`\`\`

Текст в кавычках — это **строка**. Кавычки говорят компьютеру: "это текст, не команда".

> 💡 Всегда ставь открывающую и закрывающую кавычку одинаковые: " "`,code:'print("Привет, мир!")',expect:"Привет, мир!",hint:'print("текст") — кавычки обязательны'},
{name:"Выводим числа",theory:`## Числа без кавычек

Числа можно выводить **без** кавычек. Компьютер их понимает.

\`\`\`python
print(42)
print(3 + 5)
\`\`\`

Python сам посчитает \`3 + 5\` и выведет \`8\`.

> 💡 Строки — в кавычках, числа — без`,code:'print(42)\nprint(3 + 5)',expect:"42\n8",hint:'print(42) и print(3+5) без кавычек'},
{name:"Две строки",theory:`## Несколько строк

Один \`print()\` — одна строка. Хочешь две строки — напиши \`print()\` два раза.

\`\`\`python
print("Первая строка")
print("Вторая строка")
\`\`\``,code:'print("Первая строка")\nprint("Вторая строка")',expect:"Первая строка\nВторая строка",hint:'Два print() — две строки'},
{name:"Несколько аргументов",theory:`## Запятая в print()

Если в \`print()\` несколько значений через запятую, Python ставит между ними пробел.

\`\`\`python
print("Меня зовут", "Дима")
# Выведет: Меня зовут Дима
\`\`\`

Запятая \`,\` — это "склей с пробелом".`,code:'print("Я", "учу", "Python")',expect:"Я учу Python",hint:'print("слово1", "слово2") — пробел ставится сам'}
]},
{title:"Переменные",icon:"2",tasks:[
{name:"Создаём переменную",theory:`## Переменные — коробки

Переменная — коробка с именем. Кладёшь туда значение знаком \`=\`.

\`\`\`python
name = "Аня"
age = 10
\`\`\`

Знак \`=\` — не "равно", а **"положи в коробку"**.

**Правила имён:**
- Английские буквы и цифры
- Не начинать с цифры
- Называй понятно: \`my_name\`, \`score\`, \`player_life\``,code:'name = "Аня"\nprint(name)',expect:"Аня",hint:'name = "значение"\nprint(name)'},
{name:"Текст + переменная",theory:`## Используем переменные

Переменные можно использовать с текстом через \`,\`:

\`\`\`python
city = "Москва"
print("Я живу в", city)
\`\`\`

Запятая \`,\` подставляет пробел между элементами.`,code:'city = "Москва"\nprint("Я живу в", city)',expect:"Я живу в Москва",hint:'print("текст", переменная)'},
{name:"Две переменные в одном print",theory:`## Сколько угодно переменных

В \`print()\` можно передать сколько угодно значений.

\`\`\`python
name = "Макс"
age = 10
print(name, age)
\`\`\``,code:'name = "Макс"\nage = 10\nprint("Имя:", name, "Возраст:", age)',expect:"Имя: Макс Возраст: 10",hint:'print("текст", var1, "текст", var2)'},
{name:"Математика с переменными",theory:`## Считаем через переменные

Переменные можно складывать, умножать и так далее.

\`\`\`python
a = 5
b = 3
print(a + b)  # 8
print(a * b)  # 15
\`\`\``,code:'a = 10\nb = 4\nprint(a + b)\nprint(a - b)',expect:"14\n6",hint:'a = 10; b = 4; print(a+b); print(a-b)'}
]},
{title:"Типы данных",icon:"🔤",tasks:[
{name:"Строки и числа",theory:`## Типы — разные виды данных

Каждое значение имеет **тип**.

\`\`\`python
print(type("Привет"))  # <class 'str'>  — строка
print(type(42))        # <class 'int'>   — число
print(type(3.14))      # <class 'float'> — дробное
\`\`\`

- **str** — строка (текст), в кавычках
- **int** — целое число, без кавычек
- **float** — дробное число, с точкой`,code:'print(type("Привет"))\nprint(type(42))\nprint(type(3.14))',expect:"<class 'str'>\n<class 'int'>\n<class 'float'>",hint:'type(значение) — показывает тип'},
{name:"Преобразование типов",theory:`## Меняем тип

Можно превращать одно в другое:

\`\`\`python
print(int(3.7))     # 3   — отбрасывает дробь
print(float(5))     # 5.0 — добавляет точку
print(str(100))     # "100" — делает строку
print(int("10"))    # 10  — строку в число
\`\`\`

> 💡 Когда складываешь строку и число — Python ругается. Преобразуй!`,code:'print(int(7.9))\nprint(float(3))\nprint(int("15") + 5)',expect:"7\n3.0\n20",hint:'int() — в целое, float() — в дробное, str() — в строку'}
]},
{title:"Математика",icon:"🔢",tasks:[
{name:"Арифметика",theory:`## Основные действия

Python — мощный калькулятор.

| Действие | Знак | Пример | Результат |
|----------|------|--------|-----------|
| Сложение | \`+\` | \`7 + 2\` | \`9\` |
| Вычитание | \`-\` | \`7 - 2\` | \`5\` |
| Умножение | \`*\` | \`7 * 2\` | \`14\` |
| Деление | \`/\` | \`7 / 2\` | \`3.5\` |

Деление \`/\` всегда даёт дробное число.`,code:'print(7 + 2)\nprint(7 - 2)\nprint(7 * 2)\nprint(7 / 2)',expect:"9\n5\n14\n3.5",hint:'+ - * / — обычные знаки'},
{name:"// и % — хитрые деления",theory:`## Целая часть и остаток

\`//\` — сколько раз помещается (целая часть)
\`%\` — сколько осталось (остаток)

\`\`\`python
print(9 // 2)  # 4 — двойка входит 4 раза
print(9 % 2)   # 1 — ещё 1 остался
\`\`\`

**Как запомнить:** 9 конфет на 2 друзей.
Каждому по 4 (\`//\`), 1 остался (\`%\`).`,code:'print(17 // 5)\nprint(17 % 5)',expect:"3\n2",hint:'// — целая часть, % — остаток. 17 ÷ 5 = 3 ост. 2'},
{name:"Порядок действий",theory:`## Скобки работают

Как в математике: сначала в скобках, потом умножение/деление, потом сложение/вычитание.

\`\`\`python
print(2 + 3 * 4)    # 2 + 12 = 14
print((2 + 3) * 4)  # 5 * 4 = 20
\`\`\`

Скобки \`()\` меняют порядок.`,code:'print(5 + 2 * 3)\nprint((5 + 2) * 3)',expect:"11\n21",hint:'Сначала *, /, потом +, -. Скобки меняют порядок'}
]},
{title:"Условия if",icon:"⚖️",tasks:[
{name:"Простой if/else",theory:`## Если... то...

\`if\` — "если". Компьютер проверяет условие и выбирает, что делать.

\`\`\`python
age = 12
if age >= 18:
    print("Взрослый")
else:
    print("Ребёнок")
\`\`\`

**Важно:** после \`if\` и \`else\` — \`:\`. Внутри — 4 пробела или Tab.

| Знак | Значение |
|------|----------|
| \`==\` | равно |
| \`!=\` | не равно |
| \`>\` | больше |
| \`<\` | меньше |
| \`>=\` | больше или равно |
| \`<=\` | меньше или равно |`,code:'age = 12\nif age >= 18:\n    print("Взрослый")\nelse:\n    print("Ребёнок")',expect:"Ребёнок",hint:'if условие: с новой строки с отступом print()'},
{name:"elif — несколько условий",theory:`## elif — "иначе если"

Когда нужно больше двух вариантов — \`elif\`:

\`\`\`python
mark = 85
if mark >= 90:
    print("Отлично")
elif mark >= 70:
    print("Хорошо")
elif mark >= 50:
    print("Нормально")
else:
    print("Нужно подтянуть")
\`\`\`

Проверка идёт сверху вниз. Как только нашлось подходящее — Python останавливается.`,code:'mark = 85\nif mark >= 90:\n    print("Отлично")\nelif mark >= 70:\n    print("Хорошо")\nelse:\n    print("Нормально")',expect:"Хорошо",hint:'elif = else + if. Можно хоть 10 elif подряд'},
{name:"Определяем знак числа",theory:`## Твоя программа с выбором

Напиши: если \`x > 0\` — "Плюс", если \`x < 0\` — "Минус", иначе — "Ноль".

\`\`\`python
x = -5
if x > 0:
    print("Плюс")
elif x < 0:
    print("Минус")

if (actual === expected) {
banner.textContent = 'Отлично! Всё верно!';
banner.className = 'result-banner ok';
markDone(curLesson, curTask);
// Auto-advance
const tasks = lessons[curLesson].tasks;
if (curTask + 1 < tasks.length) {
setTimeout(() => selectTask(curTask + 1), 1200);
} else if (curLesson + 1 < lessons.length) {
// next lesson
setTimeout(() => {
banner.textContent += ' Все уроки этого раздела пройдены! Переходим к следующему.';
setTimeout(() => selectLesson(curLesson + 1), 800);
}, 1200);
} else {
banner.textContent += ' Поздравляю! Ты прошёл все уроки! 🎉';
}
} else {
banner.textContent = `Ошибка. Ожидалось:\n${task.expect}\n\nПолучено:\n${out.textContent}`;
banner.className = 'result-banner err';
}
}).catch(err => {
out.textContent = err.toString();
out.className = 'out error';
banner.textContent = 'В коде ошибка!';
banner.className = 'result-banner err';
});
} catch(e) {
out.textContent = e.toString();
out.className = 'out error';
banner.textContent = 'В коде ошибка!';
banner.className = 'result-banner err';
}
}

function builtinRead(x) {
if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined)
throw new Error("File not found: " + x);
return Sk.builtinFiles["files"][x];
}

// ====== AUTH ======
function openLogin() {
if (userEmail) { logout(); return; }
document.getElementById('loginModal').classList.add('open');
document.getElementById('loginEmail').value = '';
document.getElementById('loginErr').style.display = 'none';
setTimeout(()=>document.getElementById('loginEmail').focus(),100);
}
function closeLogin() { document.getElementById('loginModal').classList.remove('open'); }
function doLogin() {
const email = document.getElementById('loginEmail').value.trim();
if (!email || !email.includes('@') || !email.includes('.')) {
document.getElementById('loginErr').style.display = 'block'; return;
}
document.getElementById('loginErr').style.display = 'none';
userEmail = email;
localStorage.setItem('py_email', email);
// Load progress for this email
const saved = localStorage.getItem('py_progress_' + email);
if (saved) progress = JSON.parse(saved);
else progress = {};
localStorage.setItem('py_progress', JSON.stringify(progress));
closeLogin();
updateUserUI();
updateProgress();
}
function logout() {
userEmail = '';
localStorage.removeItem('py_email');
localStorage.removeItem('py_progress');
progress = {};
updateUserUI();
updateProgress();
}
function updateUserUI() {
const av = document.getElementById('hAvatar');
const em = document.getElementById('hEmail');
if (userEmail) {
av.textContent = userEmail[0].toUpperCase(); av.title = 'Выйти';
em.textContent = userEmail;
} else {
av.textContent = '?'; av.title = 'Войти';
em.textContent = '';
}
}

// ====== THEORY RENDERER ======
function renderTheory(md) {
let html = '', lines = md.split('\n'), inCode = false, codeLines = [];
let th = [], ta = [], tal = [];
for (let i = 0; i < lines.length; i++) {
const l = lines[i];
if (l.startsWith('```')) {
if (inCode) { html += '<pre><code>' + esc(codeLines.join('\n')) + '</code></pre>'; codeLines=[]; inCode=false; }
else inCode = true;
continue;
}
if (inCode) { codeLines.push(l); continue; }
if (l.startsWith('|') && l.endsWith('|')) {
const p = l.split('|').filter(x=>x.trim());
if (l.includes('---')) { tal = p.map(x=>x.includes(':')?'center':'left'); continue; }
if (!th.length) th = p; else ta.push(p);
continue;
} else if (th.length) { html += buildT(th,tal,ta); th=[]; ta=[]; }
if (l.startsWith('## ')) html += `<h3>${l.slice(3)}</h3>`;
else if (l.startsWith('> ')) html += `<div class="info">${inline(l.slice(2))}</div>`;
else if (l.startsWith('- ')) html += `<li style="margin:2px 0;color:var(--text2);font-size:13px">${inline(l.slice(2))}</li>`;
else if (l.trim()==='') html += '<br>';
else if (l.startsWith('*') && l.endsWith('*')) html += `<p><em>${inline(l.slice(1,-1))}</em></p>`;
else html += `<p style="font-size:14px">${inline(l)}</p>`;
}
if (inCode) html += '<pre><code>' + esc(codeLines.join('\n')) + '</code></pre>';
if (th.length) html += buildT(th,tal,ta);
return html;
}
function buildT(headers, align, rows) {
let h = '<table style="width:100%;border-collapse:collapse;margin:6px 0;font-size:13px"><thead><tr>';
headers.forEach((c,i) => { h += `<th style="border:1px solid var(--border);padding:5px;background:var(--code-bg);color:var(--accent);text-align:${align[i]||'left'}">${c}</th>`; });
h += '</tr></thead><tbody>';
rows.forEach(r => { h += '<tr>'; r.forEach((c,i) => { h += `<td style="border:1px solid var(--border);padding:5px;color:var(--text2);text-align:${align[i]||'left'}">${inline(c)}</td>`; }); h += '</tr>'; });
h += '</tbody></table>';
return h;
}
function inline(t) { return t.replace(/\`([^`]+)\`/g, '<code style="background:var(--code-bg);padding:1px 5px;border-radius:3px;color:var(--accent);font-size:13px">$1</code>'); }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
