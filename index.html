<style>
:root{--bg:#f8fafc;--card:#fff;--text:#1e293b;--text2:#475569;--border:#e2e8f0;--hover:#f1f5f9;--active:#eff6ff;--accent:#2563eb;--accent-hover:#1d4ed8;--header-border:#e2e8f0;--code-bg:#f1f5f9;--shadow:rgba(0,0,0,0.05);--editor-bg:#f8fafc;}
.dark{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--text2:#94a3b8;--border:#334155;--hover:#1e293b;--active:#1e3a5f;--accent:#60a5fa;--accent-hover:#3b82f6;--header-border:#334155;--code-bg:#1e293b;--shadow:rgba(0,0,0,0.3);--editor-bg:#1e293b;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh;transition:background .2s,color .2s}
header{background:var(--card);padding:4px 16px;border-bottom:2px solid var(--header-border);display:flex;align-items:center;gap:10px;min-height:48px;box-shadow:0 1px 3px var(--shadow);transition:background .2s}
.header-logo{width:26px;height:26px;flex-shrink:0}
.header-title{font-size:18px;font-weight:700;color:var(--accent);letter-spacing:-0.5px;flex-shrink:0;cursor:pointer}
.header-divider{color:var(--text2);font-size:14px;flex-shrink:0}
.header-bread{font-size:12px;color:var(--text2);flex-shrink:0}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.header-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:4px 10px;border-radius:6px;cursor:pointer;font-size:12px;transition:.2s}
.header-btn:hover{background:var(--hover);color:var(--text)}
.theme-toggle{background:none;border:1px solid var(--border);color:var(--text2);padding:4px 8px;border-radius:6px;cursor:pointer;font-size:14px;transition:.2s;line-height:1}
.theme-toggle:hover{background:var(--hover);color:var(--text)}
.user-avatar{background:var(--accent);color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0}
.user-email{font-size:12px;color:var(--text2);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.container{display:flex;flex:1;overflow:hidden}
.sidebar{width:240px;background:var(--card);overflow-y:auto;padding:12px;flex-shrink:0;border-right:1px solid var(--border);transition:background .2s}
.sidebar h3{color:var(--accent);font-size:13px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.lesson{cursor:pointer;padding:8px 12px;margin:3px 0;border-radius:6px;transition:.2s;font-size:13px;border-left:3px solid transparent;color:var(--text2)}
.lesson:hover{background:var(--hover)}
.lesson.active{background:var(--active);border-left-color:var(--accent);color:var(--accent);font-weight:600}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.content{flex:1;overflow-y:auto;padding:20px 25px}
.content h2{color:var(--text);margin-bottom:12px;font-size:20px}
.content h3{color:var(--accent);margin:14px 0 6px;font-size:15px}
.content p{line-height:1.7;margin:6px 0;color:var(--text2)}
.content pre{background:var(--code-bg);padding:12px;border-radius:6px;overflow-x:auto;margin:8px 0;border:1px solid var(--border);font-size:13px;transition:background .2s}
.content code{color:var(--accent)}
.content .exercise{background:var(--card);border:1px solid var(--accent);padding:14px;border-radius:8px;margin:15px 0;transition:background .2s}
.content .exercise h4{color:var(--accent);margin-bottom:8px;font-size:14px}
.task-nav{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.task-btn{padding:5px 12px;border-radius:5px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;font-size:12px;transition:.2s}
.task-btn:hover{border-color:var(--accent);color:var(--accent)}
.task-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.editor-panel{background:var(--card);border-top:2px solid var(--border);padding:12px 15px;flex-shrink:0;transition:background .2s}
.editor-panel h3{color:var(--accent);font-size:13px;margin-bottom:6px}
.editor-row{display:flex;gap:10px;min-height:220px}
.editor-col{flex:1;display:flex;flex-direction:column}
.editor-col textarea{flex:1;background:var(--editor-bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:10px;font-family:'Consolas','Courier New',monospace;font-size:13px;resize:vertical;min-height:180px;tab-size:4;outline:none;transition:background .2s,color .2s}
.editor-col textarea:focus{border-color:var(--accent)}
.output{flex:1;background:var(--editor-bg);border:1px solid var(--border);border-radius:6px;padding:10px;font-family:'Consolas','Courier New',monospace;font-size:13px;overflow:auto;white-space:pre-wrap;min-height:180px;color:var(--text2);transition:background .2s,color .2s}
.btn-bar{display:flex;gap:6px;margin-bottom:6px}
.btn{background:var(--accent);color:#fff;border:none;padding:6px 16px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;transition:.2s}
.btn:hover{background:var(--accent-hover)}
.btn.outline{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.btn.outline:hover{background:var(--accent);color:#fff}
.btn.small{padding:4px 10px;font-size:11px}
.error{color:#ef4444}
.success{color:#22c55e}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:100}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border-radius:12px;padding:24px;width:340px;box-shadow:0 10px 40px var(--shadow);transition:background .2s}
.modal h2{color:var(--text);font-size:18px;margin-bottom:6px}
.modal p{color:var(--text2);font-size:13px;margin-bottom:16px}
.modal input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;font-size:14px;background:var(--editor-bg);color:var(--text);outline:none;transition:border .2s}
.modal input:focus{border-color:var(--accent)}
.modal .btn{width:100%;margin-top:12px;padding:10px;font-size:14px}
.modal-err{color:#ef4444;font-size:12px;margin-top:8px;display:none}
@media(max-width:768px){.container{flex-direction:column}.sidebar{width:100%;max-height:160px}.editor-row{flex-direction:column}.header-bread{display:none}}
</style>
</head>

<script>
// ========== LESSONS ==========
const lessons = [
{
title:'Введение в Python',
tasks:[
{name:'Привет, мир!', theory:`# Твоя первая программа

Python — язык программирования. Это как **робот**, который понимает команды.

## Команда print()
\`print()\` — "напечатай". Computer выводит на экран то, что в скобках.

\`\`\`python
print("Привет, мир!")
\`\`\`

Текст берётся в кавычки — это как упаковка для слов.`, starter:'print("Привет, мир!")\n', hint:'print("твой текст")'},
{name:'Выведи имя', theory:`# Выводим разное

Можно выводить **любой** текст. Главное — не забывать кавычки!

\`\`\`python
print("Меня зовут Дима")
print("Я люблю Python")
\`\`\`

Можно выводить числа без кавычек:
\`\`\`python
print(5)
print(100+200)
\`\`\``, starter:'print("Меня зовут ...")\n', hint:'print("Твоё имя")'},
{name:'Две строки', theory:`# Несколько строк

Чтобы вывести несколько строк, напиши \`print()\` несколько раз.

\`\`\`python
print("Привет!")
print("Как дела?")
print("Я учу Python!")
\`\`\`

Каждый \`print()\` — новая строка.`, starter:'print("Строка 1")\nprint("Строка 2")\n', hint:'Напиши два print()'}
]}
},
{
title:'Переменные',
tasks:[
{name:'Создай переменную', theory:`# Переменные — коробки

Переменная — **коробка с именем**, куда можно положить значение.

\`\`\`python
name = "Аня"
age = 10
\`\`\`

Знак \`=\` — не "равно", а "положи в коробку".

## Как назвать?
- Английские буквы
- Не начинай с цифры
- Называй понятно

## Типы
- \`"текст"\` — строка (str), с кавычками
- \`5\`, \`-3\` — число (int), без кавычек
- \`3.14\` — дробное (float)`, starter:'name = "Твоё имя"\nprint(name)\n', hint:'name = "имя"\nprint(name)'},
{name:'Выведи с текстом', theory:`# Текст + переменная

Можно выводить текст и переменную вместе через \`,\` — запятая ставит пробел.

\`\`\`python
city = "Москва"
print("Я живу в", city)
\`\`\`

Запятая \`,\` автоматически вставляет пробел между частями.`, starter:'city = "Москва"\nprint("Я живу в", city)\n', hint:'print("Я живу в", city)'},
{name:'Две переменные', theory:`# Несколько переменных

Можно создать сколько угодно переменных и использовать их все.

\`\`\`python
name = "Макс"
age = 10
hobby = "футбол"
print("Меня зовут", name)
print("Мне", age, "лет")
print("Моё хобби —", hobby)
\`\`\``, starter:'name = "Макс"\nage = 10\nhobby = "рисование"\nprint(name, age, hobby)\n', hint:'Создай 3 переменные и выведи их'}
]}
},
{
title:'Математика',
tasks:[
{name:'Сложение и вычитание', theory:`# Python считает!

Python — это ещё и калькулятор!

\`\`\`python
print(5 + 3)   # 8 — плюс
print(10 - 4)  # 6 — минус
\`\`\`

Знаки: \`+\` \`-\` \`*\` \`/\`

\`\`\`python
print(3 * 5)   # 15 — умножить
print(15 / 3)  # 5.0 — разделить
\`\`\`

Деление \`/\` всегда даёт дробное число.`, starter:'print(5 + 3)\nprint(10 - 4)\nprint(3 * 5)\n', hint:'Просто напиши print(c примером)'},
{name:'// и % — хитрые деления', theory:`# Остаток и целая часть

\`//\` — целая часть (сколько раз помещается)
\`%\` — остаток

\`\`\`python
print(9 // 2)  # 4 — двойка помещается 4 раза
print(9 % 2)   # 1 — ещё 1 остался
\`\`\`

## Это как пицца
У тебя 9 кусков пиццы и 2 друга.
Каждому даёшь по 4 куска (\`9 // 2 = 4\`).
Остался 1 кусок (\`9 % 2 = 1\`).`, starter:'print(9 // 2)\nprint(9 % 2)\n', hint:'// — целая часть, % — остаток'},
{name:'Конфеты и друзья', theory:`# Решаем задачку

У тебя 17 конфет и 5 друзей.
Сколько каждому достанется? Сколько останется?

\`\`\`python
total = 17
friends = 5
print("Каждому:", total // friends)
print("Останется:", total % friends)
\`\`\``, starter:'total = 17\nfriends = 5\nprint("Каждому:", total // friends)\nprint("Останется:", total % friends)\n', hint:'total // friends и total % friends'}
]}
},
{
title:'Условия if',
tasks:[
{name:'Простой if', theory:`# Если ... то ...

\`if\` — "если". С него начинается выбор.

\`\`\`python
age = 12
if age >= 18:
    print("Взрослый")
else:
    print("Ребёнок")
\`\`\`

**Правила:**
- После \`if\` и \`else\` — \`:\`
- Внутри — **4 пробела** или Tab
- \`>=\` — больше или равно

## Знаки
\`==\` равно | \`!=\` не равно | \`>\` больше | \`<\` меньше`, starter:'age = 12\nif age >= 18:\n    print("Взрослый")\nelse:\n    print("Ребёнок")\n', hint:'if условие: с новой строки с отступом print()'},
{name:'Три варианта', theory:`# elif — "иначе если"

Когда вариантов больше двух — нужен \`elif\`.

\`\`\`python
mark = 85
if mark >= 90:
    print("Отлично!")
elif mark >= 70:
    print("Хорошо")
elif mark >= 50:
    print("Нормально")
else:
    print("Нужно подтянуть")
\`\`\`

Проверка идёт сверху вниз. Как только нашлось подходящее — дальше не проверяется.`, starter:'mark = 85\nif mark >= 90:\n    print("Отлично!")\nelif mark >= 70:\n    print("Хорошо")\nelif mark >= 50:\n    print("Нормально")\nelse:\n    print("Нужно подтянуть")\n', hint:'elif — это else + if вместе'},
{name:'Положительное или нет', theory:`# Определяем знак числа

Напиши программу: если \`x > 0\` — "Плюс", если \`x < 0\` — "Минус", иначе — "Ноль".

\`\`\`python
x = -5
if x > 0:
    print("Плюс")
elif x < 0:
    print("Минус")
else:
    print("Ноль")
\`\`\``, starter:'x = -5\nif x > 0:\n    print("Плюс")\nelif x < 0:\n    print("Минус")\nelse:\n    print("Ноль")\n', hint:'if x > 0: ... elif x < 0: ... else: ...'}
]}
},
{
title:'Цикл for',
tasks:[
{name:'range до 5', theory:`# Цикл for

Цикл — команда, которая выполняется **много раз**.

\`\`\`python
for i in range(5):
    print(i)
\`\`\`

Выведет: \`0 1 2 3 4\`

\`range(5)\` — числа от 0 до 4 (не включая 5).

## Как это работает
Компьютер берёт \`i = 0\`, печатает, потом \`i = 1\`, печатает... И так 5 раз.`, starter:'for i in range(5):\n    print(i)\n', hint:'for i in range(5): print(i)'},
{name:'Диапазон с шагом', theory:`# Начало, конец, шаг

У \`range\` может быть 3 числа:
\`range(начало, конец, шаг)\`

\`\`\`python
for i in range(2, 6):   # 2,3,4,5
    print(i)

for i in range(0, 10, 2):  # 0,2,4,6,8
    print(i)
\`\`\`

Конец **не включается**! \`range(2, 6)\` — до 6, но 6 не выводит.`, starter:'for i in range(0, 10, 2):\n    print(i)\n', hint:'range(начало, конец, шаг)'},
{name:'Таблица умножения', theory:`# Умножаем с циклом

Выведем таблицу умножения для 5:

\`\`\`python
for i in range(1, 11):
    print("5 x", i, "=", 5*i)
\`\`\`

Выведет: \`5 x 1 = 5\`, \`5 x 2 = 10\`... до \`5 x 10 = 50\``, starter:'for i in range(1, 11):\n    print("5 x", i, "=", 5*i)\n', hint:'print("5 x", i, "=", 5*i)'}
]}
},
{
title:'Списки',
tasks:[
{name:'Создай список', theory:`# Списки — коллекции

Список — **набор вещей** в квадратных скобках.

\`\`\`python
toys = ["лего", "кукла", "машинка"]
print(toys[0])   # лего — первый!
print(toys[1])   # кукла
print(toys[2])   # машинка
\`\`\`

**Важно:** счёт с 0! \`toys[0]\` — первый.`, starter:'toys = ["лего", "кукла", "машинка"]\nprint(toys[0])\nprint(toys[1])\nprint(toys[2])\n', hint:'Нумерация с 0'},
{name:'Добавляем в список', theory:`# Метод .append()

\`.append()\` — добавить элемент в конец списка.

\`\`\`python
colors = ["красный", "синий"]
colors.append("зелёный")
print(colors)  # ["красный", "синий", "зелёный"]
\`\`\`

Другие методы:
- \`.insert(1, "жёлтый")\` — вставить на место 1
- \`.remove("синий")\` — удалить
- \`len(colors)\` — сколько всего`, starter:'colors = ["красный", "синий"]\ncolors.append("зелёный")\nprint(colors)\n', hint:'список.append("новый")'},
{name:'Перебор списка циклом', theory:`# Список + for

Цикл \`for\` отлично работает со списками:

\`\`\`python
fruits = ["яблоко", "банан", "вишня"]

// ========== STATE ==========
let currentLesson = 0;
let currentTask = 0;
let userEmail = localStorage.getItem('py_email') || '';
let darkTheme = localStorage.getItem('py_theme') === 'dark';

// ========== INIT ==========
if (darkTheme) document.body.classList.add('dark');
updateThemeBtn();
updateUserUI();

// ========== RENDER ==========
function renderLessons() {
const list = document.getElementById('lessonList');
list.innerHTML = lessons.map((l,i) => 
`<div class="lesson${i===currentLesson?' active':''}" onclick="selectLesson(${i})">
${i+1}. ${l.title} <span style="font-size:11px;color:var(--text2)">(${l.tasks.length} зад.)</span>
</div>`).join('');
}

function selectLesson(i) {
currentLesson = i; currentTask = 0;
document.querySelectorAll('.lesson').forEach((el,idx) => el.className='lesson'+(idx===i?' active':''));
renderContent();
loadTaskCode();
}

function renderContent() {
const el = document.getElementById('content');
const l = lessons[currentLesson];
const t = l.tasks[currentTask];

let html = `<h2>${l.title}</h2>`;
html += `<div class="task-nav">`;
l.tasks.forEach((task, idx) => {
html += `<button class="task-btn${idx===currentTask?' active':''}" onclick="selectTask(${idx})">${idx+1}. ${task.name}</button>`;
});
html += `</div>`;
html += `<div class="exercise"><h4>Задание ${currentLesson+1}.${currentTask+1}: ${t.name}</h4><div>${renderTheory(t.theory)}</div></div>`;
el.innerHTML = html;
}

function selectTask(i) {
currentTask = i;
renderContent();
loadTaskCode();
}

function loadTaskCode() {
const t = lessons[currentLesson].tasks[currentTask];
document.getElementById('codeEditor').value = t.starter;
document.getElementById('output').textContent = '// Результат появится здесь';
document.getElementById('output').className = 'output';
updateBread();
}

function updateBread() {
document.getElementById('headerBread').textContent = 
`Урок ${currentLesson+1} — Задание ${currentLesson+1}.${currentTask+1}`;
}

function goHome() { selectLesson(0); }

// ========== LOGIN ==========
function openLogin() {
if (userEmail) { logout(); return; }
document.getElementById('loginModal').classList.add('open');
document.getElementById('loginEmail').value = '';
document.getElementById('loginErr').style.display = 'none';
setTimeout(()=>document.getElementById('loginEmail').focus(),100);
}
function closeLogin() { document.getElementById('loginModal').classList.remove('open'); }
function doLogin() {
const email = document.getElementById('loginEmail').value.trim();
if (!email || !email.includes('@') || !email.includes('.')) {
document.getElementById('loginErr').style.display = 'block';
return;
}
document.getElementById('loginErr').style.display = 'none';
userEmail = email;
localStorage.setItem('py_email', email);
closeLogin();
updateUserUI();
}
function logout() {
userEmail = '';
localStorage.removeItem('py_email');
updateUserUI();
}
function updateUserUI() {
const avatar = document.getElementById('userAvatar');
const emailEl = document.getElementById('userEmail');
if (userEmail) {
avatar.textContent = userEmail[0].toUpperCase();
avatar.title = 'Выйти';
emailEl.textContent = userEmail;
} else {
avatar.textContent = '?';
avatar.title = 'Войти';
emailEl.textContent = '';
}
}

function builtinRead(x) {
if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined)
throw new Error("File not found: " + x);
return Sk.builtinFiles["files"][x];
}

out.className = 'output';

if (out.textContent === '') out.textContent = '✓ Код выполнен успешно';
out.className = 'output success';

out.className = 'output error';
});

out.className = 'output error';
}
}

// ========== RENDER THEORY (same as before) ==========
function renderTheory(md) {
let html = ''; let lines = md.split('\n'); let inCode = false; let codeLines = [];
let tableHeaders = []; let tableAlign = []; let tableRows = [];
for (let i = 0; i < lines.length; i++) {
const line = lines[i];
if (line.startsWith('```')) {
if (inCode) { html += '<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>'; codeLines = []; inCode = false; }
else { inCode = true; }
continue;
}
if (inCode) { codeLines.push(line); continue; }
if (line.startsWith('|') && line.endsWith('|')) {
const parts = line.split('|').filter(p => p.trim());
if (line.includes('---')) { tableAlign = parts.map(p => p.includes(':')?'center':'left'); continue; }
if (tableHeaders.length === 0) tableHeaders = parts;
else tableRows.push(parts);
continue;
} else if (tableHeaders.length) {
html += buildTable(tableHeaders, tableAlign, tableRows);
tableHeaders = []; tableRows = [];
}
if (line.startsWith('# ')) html += `<h2>${line.slice(2)}</h2>`;
else if (line.startsWith('## ')) html += `<h3>${line.slice(3)}</h3>`;
else if (line.startsWith('### ')) html += `<h4 style="color:var(--accent);margin:10px 0 4px">${line.slice(4)}</h4>`;
else if (line.startsWith('- ')) html += `<li style="margin:2px 0;color:var(--text2)">${inlineCode(line.slice(2))}</li>`;
else if (line.trim() === '') html += '<br>';
else if (line.startsWith('*') && line.endsWith('*')) html += `<p><em>${inlineCode(line.slice(1,-1))}</em></p>`;
else html += `<p>${inlineCode(line)}</p>`;
}
if (inCode) html += '<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>';
if (tableHeaders.length) html += buildTable(tableHeaders, tableAlign, tableRows);
return html;
}
function buildTable(headers, align, rows) {
let h = '<table style="width:100%;border-collapse:collapse;margin:8px 0;font-size:13px">';
h += '<thead><tr>';
headers.forEach((c,i) => { h += `<th style="border:1px solid var(--border);padding:6px;background:var(--code-bg);color:var(--accent);text-align:${align[i]||'left'}">${c}</th>`; });
h += '</tr></thead><tbody>';
rows.forEach(r => { h += '<tr>'; r.forEach((c,i) => { h += `<td style="border:1px solid var(--border);padding:6px;color:var(--text2);text-align:${align[i]||'left'}">${inlineCode(c)}</td>`; }); h += '</tr>'; });
h += '</tbody></table>';
return h;
}
function inlineCode(text) { return text.replace(/\`([^`]+)\`/g, '<code style="background:var(--code-bg);padding:2px 6px;border-radius:4px;color:var(--accent);font-size:13px">$1</code>'); }
function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

renderContent();
loadTaskCode();
