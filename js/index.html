<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaScript Academy</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--text2:#94a3b8;--border:#334155;--hover:#1e293b;--active:#1e3a5f;--accent:#60a5fa;--accent2:#3b82f6;--ok:#48bb78;--okbg:#1a2e1a;--err:#fc8181;--errbg:#2e1a1a;--code-bg:#1a2332;--shadow:rgba(0,0,0,0.3);--editor-bg:#1a2332;--header-bg:#1a2332}
.light{--bg:#f0f4f8;--card:#fff;--text:#1e293b;--text2:#475569;--border:#e2e8f0;--hover:#f1f5f9;--active:#eff6ff;--accent:#2563eb;--accent2:#1d4ed8;--ok:#38a169;--okbg:#f0fff4;--err:#e53e3e;--errbg:#fff5f5;--code-bg:#f1f5f9;--shadow:rgba(0,0,0,0.05);--editor-bg:#f8fafc;--header-bg:#fff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh;transition:background .3s,color .3s}
.h-title{font-size:16px;font-weight:700;color:var(--accent);cursor:pointer;letter-spacing:-.3px;white-space:nowrap}
.h-div{color:var(--text2);font-size:13px}
.h-bread{font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.h-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:3px 8px;border-radius:5px;cursor:pointer;font-size:11px;transition:.2s;white-space:nowrap}
.h-btn:hover{background:var(--hover);color:var(--text)}
.av{background:var(--accent);color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;cursor:pointer;flex-shrink:0}
.em{font-size:11px;color:var(--text2);max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr{width:80px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.pr-bar{height:100%;background:var(--accent);transition:width .5s}
.container{display:flex;flex:1;overflow:hidden}
.sidebar{width:240px;background:var(--card);overflow-y:auto;flex-shrink:0;border-right:1px solid var(--border)}
.sidebar-in{padding:10px}
.sidebar h3{color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;padding:0 4px}
.lgrp{margin-bottom:2px;border-radius:6px;overflow:hidden}
.lgrp-hdr{cursor:pointer;padding:8px 10px;font-size:13px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:6px;border-radius:6px;transition:.2s}
.lgrp-hdr:hover{background:var(--hover)}
.lgrp-hdr .arr{font-size:10px;transition:transform .2s;color:var(--text2)}
.lgrp-hdr .arr.open{transform:rotate(90deg)}
.lgrp-hdr .cnt{font-size:10px;color:var(--text2);margin-left:auto;opacity:.7}
.lgrp-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.lgrp-body.open{max-height:400px}
.ltask{cursor:pointer;padding:5px 10px 5px 26px;font-size:12px;color:var(--text2);border-radius:4px;margin:1px 4px;display:flex;align-items:center;gap:5px;transition:.2s}
.ltask:hover{background:var(--hover)}
.ltask.active{background:var(--active);color:var(--accent);font-weight:600}
.ltask .dot{width:8px;height:8px;border-radius:50%;background:var(--border);flex-shrink:0}
.ltask .dot.done{background:var(--ok)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.content{flex:1;overflow-y:auto;padding:18px 22px}
.content h2{font-size:18px;margin-bottom:8px;color:var(--text)}
.content h3{color:var(--accent);font-size:14px;margin:12px 0 5px}
.content p{line-height:1.65;margin:5px 0;color:var(--text2);font-size:14px}
.content pre{background:var(--code-bg);padding:10px 12px;border-radius:6px;overflow-x:auto;margin:6px 0;border:1px solid var(--border);font-size:13px}
.content code{color:var(--accent);font-size:13px}
.content .info{background:var(--active);border-left:3px solid var(--accent);padding:10px 14px;margin:8px 0;border-radius:0 6px 6px 0;font-size:13px;color:var(--text2)}
.task-bar{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.tb{padding:4px 10px;border-radius:4px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;font-size:11px;transition:.2s}
.tb:hover{border-color:var(--accent);color:var(--accent)}
.tb.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tb.done{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.task-box{background:var(--card);border:1px solid var(--accent);padding:12px 14px;border-radius:8px;margin:10px 0}
.task-box h4{color:var(--accent);font-size:14px;margin-bottom:8px}
.res-ban{padding:8px 14px;border-radius:6px;margin:8px 0;font-size:13px;font-weight:600;display:none}
.res-ban.ok{display:block;background:var(--okbg);color:var(--ok);border:1px solid var(--ok)}
.res-ban.err{display:block;background:var(--errbg);color:var(--err);border:1px solid var(--err)}
.res-ban.ok::before{content:'✓ '}
.res-ban.err::before{content:'✗ '}
.editor-panel{background:var(--card);border-top:2px solid var(--border);padding:10px 15px;flex-shrink:0}
.er-bar{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.er-bar label{color:var(--accent);font-size:12px;font-weight:600}
.er-row{display:flex;gap:10px;min-height:200px}
.er-col{flex:1;display:flex;flex-direction:column}
.er-col textarea{flex:1;background:var(--editor-bg);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:10px;font-family:'Consolas','Courier New',monospace;font-size:13px;resize:vertical;min-height:180px;tab-size:4;outline:none}
.er-col textarea:focus{border-color:var(--accent)}
.out{flex:1;background:var(--editor-bg);border:1px solid var(--border);border-radius:5px;padding:10px;font-family:'Consolas','Courier New',monospace;font-size:13px;overflow:auto;white-space:pre-wrap;min-height:180px;color:var(--text2)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border-radius:12px;padding:24px;width:340px;box-shadow:0 10px 40px rgba(0,0,0,.1)}
.modal h2{font-size:17px;margin-bottom:4px;color:var(--text)}
.modal p{font-size:12px;color:var(--text2);margin-bottom:14px}
.modal input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:5px;font-size:14px;background:var(--editor-bg);color:var(--text);outline:none}
.modal input:focus{border-color:var(--accent)}
.modal .btn{width:100%;margin-top:10px;padding:9px;font-size:13px}
.modal .merr{color:var(--err);font-size:12px;margin-top:6px;display:none}
.btn{background:var(--accent);color:#fff;border:none;padding:5px 14px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;transition:.2s}
.btn:hover{background:var(--accent2)}
.btn.outline{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.btn.outline:hover{background:var(--accent);color:#fff}
.btn.sm{padding:4px 10px;font-size:11px}
@media(max-width:768px){.container{flex-direction:column}.sidebar{width:100%;max-height:180px}.er-row{flex-direction:column}.h-bread{display:none}}

.nav-bar{position:fixed;top:16px;right:68px;display:flex;gap:2px;z-index:100;background:rgba(255,255,255,0.06);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:22px;border:1px solid rgba(255,255,255,0.1);padding:4px;height:44px}
.nav-bar button{background:transparent;border:none;color:rgba(255,255,255,0.7);padding:8px 14px;cursor:pointer;border-radius:18px;font-size:16px;transition:.3s;display:flex;align-items:center;justify-content:center;height:36px;width:36px}
.nav-bar button:hover{background:rgba(255,255,255,0.12);color:#fff}
.menu-btn{position:fixed;top:16px;right:16px;width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,0.08);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.15);cursor:pointer;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:.3s}
.menu-btn:hover{background:rgba(255,255,255,0.15);transform:scale(1.05)}
.menu-btn span{display:block;width:18px;height:2px;background:rgba(255,255,255,0.8);border-radius:2px;transition:.3s}
.menu-overlay{position:fixed;top:12px;left:12px;bottom:12px;width:280px;background:rgba(15,23,42,0.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:20px;z-index:99;transform:translateX(-110%);transition:transform .35s ease;display:flex;flex-direction:column;padding:80px 16px 16px;border:1px solid rgba(255,255,255,0.08)}
.menu-overlay.open{transform:translateX(0)}
.menu-items{display:flex;flex-direction:column;gap:8px;width:100%;flex:1;overflow-y:auto}
.menu-items a{color:#e2e8f0;text-decoration:none;font-size:16px;font-weight:500;padding:10px 16px;border-radius:100px;background:rgba(255,255,255,0.04);transition:.3s;display:block}
.menu-items a:hover{background:rgba(255,255,255,0.1)}
.menu-bottom{margin-top:auto;width:100%;display:flex;flex-direction:column;gap:8px}
.menu-settings{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 16px;border-radius:100px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);color:#cbd5e1;cursor:pointer;font-size:14px;font-weight:500;transition:.3s}
.menu-settings:hover{background:rgba(255,255,255,0.12);color:#fff}

</style>
</head>
<body>
<div class="nav-bar">
<button onclick="history.back()" title="Назад">←</button>
<button onclick="location.href='../'" title="Домой">⌂</button>
<button onclick="history.forward()" title="Вперёд">→</button>
</div>

<button class="menu-btn" id="menuBtn" onclick="toggleMenu()">
<span></span><span></span><span></span>
</button>

<div class="menu-overlay" id="menuOverlay">
<div class="menu-items" onclick="closeMenu()">
<a href="../">Главная</a>
<a href="../python/">Python</a>
<a href="../cpp/">C++</a>
<a href="../c/">C</a>
<a href="../csharp/">C#</a>

</div>

<button class="menu-settings" onclick="location.href='../'">Настройки</button>
</div>
</div>

<div class="container">
<div class="sidebar"><div class="sidebar-in">
<h3>Уроки</h3>
<div id="lessonList"></div>
<div style="margin-top:12px;padding:0 4px">
<h3>Статистика</h3>
<div style="font-size:11px;color:var(--text2)" id="statsText">Решено: 0 / 0</div>
</div>
</div></div>
<div class="main">
<div class="content" id="content"></div>
<div class="editor-panel">
<div class="er-bar">
<label>Редактор кода</label>
<div style="flex:1"></div>
<button class="btn sm" onclick="runAndCheck()">▶ Проверить</button>
<button class="btn outline sm" onclick="resetCode()">↺ Сброс</button>
<button class="btn outline sm" onclick="showHint()">💡 Подсказка</button>
</div>
<div class="er-row">
<div class="er-col"><textarea id="codeEditor" spellcheck="false"></textarea></div>
<div class="er-col"><div class="out" id="output">// Напиши код и нажми "Проверить"</div></div>
</div>
</div>
</div>
</div>
<div class="modal-overlay" id="loginModal">
<div class="modal">
<h2>Вход</h2>
<p>Email сохранит твой прогресс</p>
<input type="email" id="loginEmail" placeholder="email@example.com" onkeydown="if(event.key==='Enter')doLogin()">
<div class="merr" id="loginErr">Некорректный email</div>
<button class="btn" onclick="doLogin()">Войти</button>
<button class="btn outline" style="margin-top:6px" onclick="closeLogin()">Отмена</button>
</div>
</div>
<script>
const P='js';
const LESSONS=[{"title": "Основы", "icon": "1", "tasks": [{"name": "console.log", "code": "console.log(\"Привет, мир!\");", "expect": "Привет, мир!", "sample": "Привет, мир!", "hint": "console.log — вывод в консоль"}, {"name": "Комментарии", "code": "// Это комментарий\n/* Тоже\n   комментарий */\nconsole.log(42);", "expect": "42", "sample": "42", "hint": "// и /* */ — комментарии"}]}, {"title": "Переменные", "icon": "2", "tasks": [{"name": "let и const", "code": "let age = 10;\nconst name = \"Аня\";\nage = 11;\nconsole.log(age, name);", "expect": "11 Аня", "sample": "11 Аня", "hint": "let — можно менять, const — нельзя"}, {"name": "Типы", "code": "console.log(typeof \"текст\");\nconsole.log(typeof 42);\nconsole.log(typeof true);\nconsole.log(typeof [1,2]);", "expect": "string\nnumber\nboolean\nobject", "sample": "string/number/boolean/object", "hint": "typeof — тип значения"}]}, {"title": "Функции", "icon": "⚙️", "tasks": [{"name": "Функция", "code": "function greet(name) {\n    return \"Привет, \" + name + \"!\";\n}\nconsole.log(greet(\"Макс\"));", "expect": "Привет, Макс!", "sample": "Привет, Макс!", "hint": "function имя(параметр) { }"}, {"name": "Стрелочная", "code": "const double = (x) => x * 2;\nconsole.log(double(5));", "expect": "10", "sample": "10", "hint": "const f = (x) => x * 2 — стрелочная функция"}]}, {"title": "Условия", "icon": "⚖️", "tasks": [{"name": "if/else", "code": "let age = 12;\nif (age >= 18) {\n    console.log(\"Взрослый\");\n} else {\n    console.log(\"Ребёнок\");\n}", "expect": "Ребёнок", "sample": "Ребёнок", "hint": "if (условие) { } else { }"}, {"name": "Тернарный", "code": "let x = 5;\nlet result = x > 0 ? \"Плюс\" : \"Минус\";\nconsole.log(result);", "expect": "Плюс", "sample": "Плюс", "hint": "условие ? да : нет"}]}, {"title": "Циклы", "icon": "🔄", "tasks": [{"name": "for", "code": "for (let i = 0; i < 5; i++) {\n    console.log(i);\n}", "expect": "0\n1\n2\n3\n4", "sample": "0\\n1\\n2\\n3\\n4", "hint": "for (начало; условие; шаг)"}, {"name": "for...of", "code": "let fruits = [\"яблоко\", \"банан\"];\nfor (let f of fruits) {\n    console.log(\"Я люблю \" + f);\n}", "expect": "Я люблю яблоко\nЯ люблю банан", "sample": "Я люблю яблоко\\nЯ люблю банан", "hint": "for (let x of массив)"}]}, {"title": "Массивы", "icon": "📋", "tasks": [{"name": "Методы", "code": "let nums = [1, 2, 3];\nnums.push(4);\nconsole.log(nums.length);\nconsole.log(nums.includes(2));", "expect": "4\ntrue", "sample": "4\\ntrue", "hint": "push, length, includes"}, {"name": "map и filter", "code": "let nums = [1, 2, 3, 4];\nlet doubled = nums.map(n => n * 2);\nlet even = nums.filter(n => n % 2 === 0);\nconsole.log(doubled);\nconsole.log(even);", "expect": "[2, 4, 6, 8]\n[2, 4]", "sample": "[2, 4, 6, 8] [2, 4]", "hint": "map — преобразует, filter — фильтрует"}]}, {"title": "Объекты", "icon": "📖", "tasks": [{"name": "Объект", "code": "let person = {\n    name: \"Дима\",\n    age: 10\n};\nconsole.log(person.name);\nconsole.log(person[\"age\"]);", "expect": "Дима\n10", "sample": "Дима\\n10", "hint": "obj.ключ или obj[\"ключ\"]"}, {"name": "Деструктуризация", "code": "let {name, age} = {name: \"Аня\", age: 9};\nconsole.log(name, age);", "expect": "Аня 9", "sample": "Аня 9", "hint": "let {ключ} = объект"}]}, {"title": "DOM", "icon": "🖥️", "tasks": [{"name": "Выбор элементов", "code": "// В браузере:\ndocument.querySelector(\"#app\").textContent = \"Привет\";\ndocument.querySelectorAll(\".item\").length;", "expect": "Элемент #app = Привет", "sample": "Работа с DOM", "hint": "querySelector, querySelectorAll"}, {"name": "Создание элемента", "code": "let div = document.createElement(\"div\");\ndiv.textContent = \"Новый\";\ndocument.body.appendChild(div);", "expect": "div добавлен в body", "sample": "Создание и вставка", "hint": "createElement + appendChild"}]}, {"title": "События", "icon": "🔔", "tasks": [{"name": "addEventListener", "code": "let btn = document.querySelector(\"button\");\nbtn.addEventListener(\"click\", () => {\n    console.log(\"Клик!\");\n});", "expect": "Клик! по нажатию", "sample": "Обработчик клика", "hint": "addEventListener(\"click\", функция)"}]}, {"title": "Fetch и async", "icon": "🌐", "tasks": [{"name": "fetch", "code": "fetch(\"https://api.example.com/data\")\n    .then(r => r.json())\n    .then(data => console.log(data));", "expect": "Данные с сервера", "sample": "Запрос к API", "hint": "fetch + .then + .json()"}, {"name": "async/await", "code": "async function load() {\n    let res = await fetch(\"https://api.example.com/data\");\n    let data = await res.json();\n    console.log(data);\n}\nload();", "expect": "Данные с сервера", "sample": "Асинхронная загрузка", "hint": "async function + await"}]}, {"title": "Продвинутое", "icon": "🚀", "tasks": [{"name": "Классы", "code": "class Cat {\n    constructor(name) {\n        this.name = name;\n    }\n    meow() {\n        return this.name + \": Мяу!\";\n    }\n}\nlet cat = new Cat(\"Барсик\");\nconsole.log(cat.meow());", "expect": "Барсик: Мяу!", "sample": "Барсик: Мяу!", "hint": "class + constructor + new"}, {"name": "Spread", "code": "let a = [1, 2];\nlet b = [3, 4];\nlet c = [...a, ...b];\nconsole.log(c);", "expect": "[1, 2, 3, 4]", "sample": "[1, 2, 3, 4]", "hint": "... — распаковка массива"}]}];
let curLesson=0,curTask=0;
let userEmail=localStorage.getItem('lingx_email')||'';
let dark=localStorage.getItem('lingx_theme')!=='light';
let progress=JSON.parse(localStorage.getItem('lingx_progress')||'{}');
if(!dark){document.body.classList.add('light')};
updateThemeBtn();updateUserUI();
function stats(){let t=0,d=0;LESSONS.forEach((l,li)=>l.tasks.forEach((x,ti)=>{t++;if(progress[li+'_'+ti])d++;}));return{t,d};}
function updateStats(){const{t,d}=stats();const st=document.getElementById('statsText');if(st)st.textContent='Решено: '+d+' / '+t;const pb=document.getElementById('prBar');if(pb)pb.style.width=t?(d/t*100)+'%':'0%';renderSidebar()}
function markDone(li,ti){progress[li+'_'+ti]=true;localStorage.setItem('lingx_progress',JSON.stringify(progress));updateStats();}
let openLesson=-1;
function renderSidebar(){const el=document.getElementById('lessonList');let h='';LESSONS.forEach((l,li)=>{const ld=l.tasks.filter((x,ti)=>progress[li+'_'+ti]).length;const o=openLesson===li;h+=`<div class="lgrp"><div class="lgrp-hdr" onclick="toggleLesson(${li})"><span class="arr ${o?'open':''}">▶</span>${l.icon}. ${l.title}<span class="cnt">${ld}/${l.tasks.length}</span></div><div class="lgrp-body ${o?'open':''}">`;l.tasks.forEach((t,ti)=>{const a=li===curLesson&&ti===curTask;const dn=progress[li+'_'+ti];h+=`<div class="ltask ${a?'active':''}" onclick="selectTask(${li},${ti})"><span class="dot ${dn?'done':''}"></span>${ti+1}. ${t.name}</div>`;});h+=`</div></div>`;});el.innerHTML=h;}
function toggleLesson(li){openLesson=openLesson===li?-1:li;renderSidebar();}
function selectTask(li,ti){curLesson=li;curTask=ti;openLesson=li;renderSidebar();renderContent();loadCode();updateBread();const b=document.getElementById('resBan');if(b)b.className='res-ban';}
function renderContent(){const c=document.getElementById('content');const l=LESSONS[curLesson];const t=l.tasks[curTask];let h=`<h2>${l.title}</h2><div class="task-bar">`;l.tasks.forEach((ta,idx)=>{let cl='tb'+(idx===curTask?' active':'')+(progress[curLesson+'_'+idx]?' done':'');h+=`<button class="${cl}" onclick="selectTask(${curLesson},${idx})">${idx+1}. ${ta.name}</button>`;});h+=`</div><div class="task-box"><h4>Задание ${curLesson+1}.${curTask+1}: ${t.name}</h4>${renderTheory(t.theory||'')}<div class="res-ban" id="resBan"></div></div>`;c.innerHTML=h;}
function renderTheory(md){let html='',lines=md.split('\n'),inCode=false,cl=[];let th=[],ta=[],tal=[];for(let i=0;i<lines.length;i++){const l=lines[i];if(l.startsWith('```')){if(inCode){html+='<pre><code>'+esc(cl.join('\n'))+'</code></pre>';cl=[];inCode=false;}else inCode=true;continue;}if(inCode){cl.push(l);continue;}if(l.startsWith('|')&&l.endsWith('|')){const p=l.split('|').filter(x=>x.trim());if(l.includes('---')){tal=p.map(x=>x.includes(':')?'center':'left');continue;}if(!th.length)th=p;else ta.push(p);continue;}else if(th.length){html+=buildT(th,tal,ta);th=[];ta=[];}if(l.startsWith('## '))html+=`<h3>${l.slice(3)}</h3>`;else if(l.startsWith('> '))html+=`<div class="info">${inline(l.slice(2))}</div>`;else if(l.startsWith('- '))html+=`<li style="margin:2px 0;color:var(--text2);font-size:13px">${inline(l.slice(2))}</li>`;else if(l.trim()==='')html+='<br>';else html+=`<p style="font-size:14px">${inline(l)}</p>`;}if(inCode)html+='<pre><code>'+esc(cl.join('\n'))+'</code></pre>';if(th.length)html+=buildT(th,tal,ta);return html;}
function buildT(hd,al,rows){let h='<table style="width:100%;border-collapse:collapse;margin:6px 0;font-size:13px"><thead><tr>';hd.forEach((c,i)=>{h+=`<th style="border:1px solid var(--border);padding:5px;background:var(--code-bg);color:var(--accent);text-align:${al[i]||'left'}">${c}</th>`;});h+='</tr></thead><tbody>';rows.forEach(r=>{h+='<tr>';r.forEach((c,i)=>{h+=`<td style="border:1px solid var(--border);padding:5px;color:var(--text2);text-align:${al[i]||'left'}">${inline(c)}</td>`;});h+='</tr>';});h+='</tbody></table>';return h;}
function inline(t){return t.replace(/\`([^`]+)\`/g,'<code style="background:var(--code-bg);padding:1px 5px;border-radius:3px;color:var(--accent);font-size:13px">$1</code>');}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function normalize(s){return s.replace(/\s+$/gm,'').replace(/^\s+/gm,'').replace(/[\r\n]+/g,'\n').trim();}
function runAndCheck(){const code=document.getElementById('codeEditor').value;const out=document.getElementById('output');const ban=document.getElementById('resBan');const t=LESSONS[curLesson].tasks[curTask];out.textContent='';out.className='out';if(ban)ban.className='res-ban';
if(!t.expect){out.textContent='// Код готов! Запусти его в своём компиляторе/браузере.\n// Ожидаемый результат:\n'+(t.sample||'');if(ban){ban.textContent='Код написан! Проверь его в реальном окружении';ban.className='res-ban ok';}return;}
out.textContent='// Этот язык не выполняется в браузере.\n// Ожидаемый вывод:\n'+t.expect;
if(ban){ban.textContent='Код написан верно! (сверь с ожидаемым выводом)';ban.className='res-ban ok';markDone(curLesson,curTask);const tasks=LESSONS[curLesson].tasks;if(curTask+1<tasks.length){setTimeout(()=>selectTask(curLesson,curTask+1),1500);}else if(curLesson+1<LESSONS.length){setTimeout(()=>selectTask(curLesson+1,0),1800);}else{ban.textContent+=' Поздравляю! Курс пройден! 🎉';}}}
function loadCode(){document.getElementById('codeEditor').value=LESSONS[curLesson].tasks[curTask].code;document.getElementById('output').textContent='// Напиши код и нажми "Проверить"';document.getElementById('output').className='out';}
function resetCode(){loadCode();const b=document.getElementById('resBan');if(b)b.className='res-ban';}
function showHint(){const t=LESSONS[curLesson].tasks[curTask];document.getElementById('output').textContent='💡 Подсказка: '+t.hint;document.getElementById('output').className='out';}
function goHome(){selectTask(0,0);}
function updateBread(){document.getElementById('hBread').textContent=`Урок ${curLesson+1} — Зад. ${curLesson+1}.${curTask+1}`;}
function openLogin(){if(userEmail){logout();return;}document.getElementById('loginModal').classList.add('open');document.getElementById('loginEmail').value='';document.getElementById('loginErr').style.display='none';setTimeout(()=>document.getElementById('loginEmail').focus(),100);}
function closeLogin(){document.getElementById('loginModal').classList.remove('open');}
function doLogin(){const email=document.getElementById('loginEmail').value.trim();if(!email||!email.includes('@')||!email.includes('.')){document.getElementById('loginErr').style.display='block';return;}document.getElementById('loginErr').style.display='none';userEmail=email;localStorage.setItem('lingx_email',email);const s=localStorage.getItem('lingx_progress_'+email);if(s)progress=JSON.parse(s);else progress={};localStorage.setItem('lingx_progress',JSON.stringify(progress));closeLogin();updateUserUI();updateStats();}
function logout(){userEmail='';localStorage.removeItem('lingx_email');localStorage.removeItem('lingx_progress');progress={};updateUserUI();updateStats();}
function updateUserUI(){const av=document.getElementById('hAvatar'),em=document.getElementById('hEmail');if(!av&&!em)return;if(userEmail){if(av){av.textContent=userEmail[0].toUpperCase();av.title='Выйти'}if(em)em.textContent=userEmail}else{if(av){av.textContent='?';av.title='Войти'}if(em)em.textContent=''}}
function toggleTheme(){
dark=!dark;
localStorage.setItem('lingx_theme',dark?'dark':'light');
if(dark){document.body.classList.remove('light');document.body.classList.add('dark')}
else{document.body.classList.remove('dark');document.body.classList.add('light')}
}
function updateThemeBtn(){const tb=document.getElementById('themeBtn');if(tb)tb.textContent=dark?'🌙':'☀️'}
function toggleMenu(){document.getElementById('menuOverlay').classList.toggle('open')}
function closeMenu(){document.getElementById('menuOverlay').classList.remove('open')}
function syncAccount(){const ue=localStorage.getItem('lingx_email')||'',tok=localStorage.getItem('lingx_token')||'',hav=document.getElementById('hAvatar'),hem=document.getElementById('hEmail');if(!hav&&!hem)return;if(hav)hav.textContent=ue?ue[0].toUpperCase():'?';if(hem)hem.textContent=ue||''}

</script>
