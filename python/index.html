<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python — LingX</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">
<script src="https://skulpt.org/js/skulpt.min.js"></script>
<script src="https://skulpt.org/js/skulpt-stdlib.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/python/python.min.js"></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--text2:#94a3b8;--border:#334155;--hover:#1e293b;--active:#1e3a5f;--accent:#60a5fa;--accent2:#3b82f6;--ok:#48bb78;--okbg:#1a2e1a;--err:#fc8181;--errbg:#2e1a1a;--code-bg:#1a2332;--shadow:rgba(0,0,0,0.3);--editor-bg:#1a2332;--header-bg:#1a2332}
.light{--bg:#f0f4f8;--card:#fff;--text:#1e293b;--text2:#475569;--border:#e2e8f0;--hover:#f1f5f9;--active:#eff6ff;--accent:#2563eb;--accent2:#1d4ed8;--ok:#38a169;--okbg:#f0fff4;--err:#e53e3e;--errbg:#fff5f5;--code-bg:#f1f5f9;--shadow:rgba(0,0,0,0.05);--editor-bg:#f8fafc;--header-bg:#fff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;min-height:100vh;transition:background .3s,color .3s}
.h-logo{width:24px;height:24px;flex-shrink:0}
.h-title{font-size:16px;font-weight:700;color:var(--accent);cursor:pointer;letter-spacing:-.3px}
.h-div{color:var(--text2);font-size:13px}
.h-bread{font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.h-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:3px 8px;border-radius:5px;cursor:pointer;font-size:11px;transition:.2s;white-space:nowrap}
.h-btn:hover{background:var(--hover);color:var(--text)}
.av{background:var(--accent);color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;cursor:pointer;flex-shrink:0}
.em{font-size:11px;color:var(--text2);max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr{width:80px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.pr-bar{height:100%;background:var(--accent);transition:width .5s;border-radius:2px}
.container{display:flex;flex:1;overflow:hidden}
.sidebar{width:240px;background:var(--card);overflow-y:auto;flex-shrink:0;border-right:1px solid var(--border)}
.sidebar-in{padding:10px}
.sidebar h3{color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;padding:0 4px}
.lgrp{margin-bottom:2px;border-radius:6px;overflow:hidden}
.lgrp-hdr{cursor:pointer;padding:8px 10px;font-size:13px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:6px;border-radius:6px;transition:.2s}
.lgrp-hdr:hover{background:var(--hover)}
.lgrp-hdr .arr{font-size:10px;transition:transform .2s;color:var(--text2)}
.lgrp-hdr .arr.open{transform:rotate(90deg)}
.lgrp-hdr .cnt{font-size:10px;color:var(--text2);margin-left:auto;opacity:.7}
.lgrp-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.lgrp-body.open{max-height:400px}
.ltask{cursor:pointer;padding:5px 10px 5px 26px;font-size:12px;color:var(--text2);border-radius:4px;margin:1px 4px;transition:.2s;display:flex;align-items:center;gap:5px}
.ltask:hover{background:var(--hover)}
.ltask.active{background:var(--active);color:var(--accent);font-weight:600}
.ltask .dot{width:8px;height:8px;border-radius:50%;background:var(--border);flex-shrink:0}
.ltask .dot.done{background:var(--ok)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.content{flex:1;overflow-y:auto;padding:18px 22px}
.content h2{font-size:18px;margin-bottom:8px;color:var(--text)}
.content h3{color:var(--accent);font-size:14px;margin:12px 0 5px}
.content p{line-height:1.65;margin:5px 0;color:var(--text2);font-size:14px}
.content pre{background:var(--code-bg);padding:10px 12px;border-radius:6px;overflow-x:auto;margin:6px 0;border:1px solid var(--border);font-size:13px}
.content code{color:var(--accent);font-size:13px}
.content .info{background:var(--active);border-left:3px solid var(--accent);padding:10px 14px;margin:8px 0;border-radius:0 6px 6px 0;font-size:13px;color:var(--text2)}
.task-bar{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.tb{padding:4px 10px;border-radius:4px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;font-size:11px;transition:.2s}
.tb:hover{border-color:var(--accent);color:var(--accent)}
.tb.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tb.done{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.task-box{background:var(--card);border:1px solid var(--accent);padding:12px 14px;border-radius:8px;margin:10px 0}
.task-box h4{color:var(--accent);font-size:14px;margin-bottom:8px}
.res-ban{padding:8px 14px;border-radius:6px;margin:8px 0;font-size:13px;font-weight:600;display:none}
.res-ban.ok{display:block;background:var(--okbg);color:var(--ok);border:1px solid var(--ok)}
.res-ban.err{display:block;background:var(--errbg);color:var(--err);border:1px solid var(--err)}
.res-ban.ok::before{content:'✓ '}
.res-ban.err::before{content:'✗ '}
.editor-panel{background:var(--card);border-top:2px solid var(--border);padding:10px 15px;flex-shrink:0}
.er-bar{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.er-bar label{color:var(--accent);font-size:12px;font-weight:600}
.er-row{display:flex;gap:10px;min-height:200px}
.er-col{flex:1;display:flex;flex-direction:column}
.er-col textarea{flex:1;background:var(--editor-bg);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:10px;font-family:'Consolas','Courier New',monospace;font-size:13px;resize:vertical;min-height:180px;tab-size:4;outline:none}
.er-col textarea:focus{border-color:var(--accent)}
.out{flex:1;background:var(--editor-bg);border:1px solid var(--border);border-radius:5px;padding:10px;font-family:'Consolas','Courier New',monospace;font-size:13px;overflow:auto;white-space:pre-wrap;min-height:180px;color:var(--text2)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border-radius:12px;padding:24px;width:340px;box-shadow:0 10px 40px var(--shadow)}
.modal h2{font-size:17px;margin-bottom:4px;color:var(--text)}
.modal p{font-size:12px;color:var(--text2);margin-bottom:14px}
.modal input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:5px;font-size:14px;background:var(--editor-bg);color:var(--text);outline:none}
.modal input:focus{border-color:var(--accent)}
.modal .btn{width:100%;margin-top:10px;padding:9px;font-size:13px}
.modal .merr{color:var(--err);font-size:12px;margin-top:6px;display:none}
.btn{background:var(--accent);color:#fff;border:none;padding:5px 14px;border-radius:5px;cursor:pointer;font-size:12px;font-weight:600;transition:.2s}
.btn:hover{background:var(--accent2)}
.btn.outline{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.btn.outline:hover{background:var(--accent);color:#fff}
.btn.sm{padding:4px 10px;font-size:11px}
.CodeMirror{height:100%!important;font-family:'Consolas','Courier New',monospace!important;font-size:13px!important;border-radius:5px;background:var(--editor-bg)!important;color:var(--text)!important}
.CodeMirror-gutters{background:var(--editor-bg)!important;border-right:1px solid var(--border)!important}
.CodeMirror-cursor{border-color:var(--accent)!important}
.cm-s-default .cm-keyword{color:#c792ea!important}
.cm-s-default .cm-builtin{color:#82aaff!important}
.cm-s-default .cm-string{color:#c3e88d!important}
.cm-s-default .cm-number{color:#f78c6c!important}
.cm-s-default .cm-comment{color:#546e7a!important;font-style:italic}
@media(max-width:768px){.container{flex-direction:column}.sidebar{width:100%;max-height:180px}.er-row{flex-direction:column}.h-bread{display:none}}

.nav-bar{position:fixed;top:16px;right:68px;display:flex;gap:2px;z-index:100;background:rgba(255,255,255,0.06);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:22px;border:1px solid rgba(255,255,255,0.1);padding:4px;height:44px}
.nav-bar button{background:transparent;border:none;color:rgba(255,255,255,0.7);padding:8px 14px;cursor:pointer;border-radius:18px;font-size:16px;transition:.3s;display:flex;align-items:center;justify-content:center;height:36px;width:36px}
.nav-bar button:hover{background:rgba(255,255,255,0.12);color:#fff}
.menu-btn{position:fixed;top:16px;right:16px;width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,0.08);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.15);cursor:pointer;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:.3s}
.menu-btn:hover{background:rgba(255,255,255,0.15);transform:scale(1.05)}
.menu-btn span{display:block;width:18px;height:2px;background:rgba(255,255,255,0.8);border-radius:2px;transition:.3s}
.menu-overlay{position:fixed;top:12px;left:12px;bottom:12px;width:280px;background:rgba(15,23,42,0.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:20px;z-index:99;transform:translateX(-110%);transition:transform .35s ease;display:flex;flex-direction:column;padding:80px 16px 16px;border:1px solid rgba(255,255,255,0.08)}
.menu-overlay.open{transform:translateX(0)}
.menu-items{display:flex;flex-direction:column;gap:8px;width:100%;flex:1;overflow-y:auto}
.menu-items a{color:#e2e8f0;text-decoration:none;font-size:16px;font-weight:500;padding:10px 16px;border-radius:100px;background:rgba(255,255,255,0.04);transition:.3s;display:block}
.menu-items a:hover{background:rgba(255,255,255,0.1)}
.menu-bottom{margin-top:auto;width:100%;display:flex;flex-direction:column;gap:8px}
.menu-settings{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 16px;border-radius:100px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);color:#cbd5e1;cursor:pointer;font-size:14px;font-weight:500;transition:.3s}
.menu-settings:hover{background:rgba(255,255,255,0.12);color:#fff}

</style>
</head>
<body>
<div class="nav-bar">
<button onclick="history.back()" title="Назад">←</button>
<button onclick="location.href='../'" title="Домой">⌂</button>

<span></span><span></span><span></span>

<div class="container">
<div class="sidebar"><div class="sidebar-in">
<h3>Уроки</h3>
<div id="lessonList"></div>
<div style="margin-top:12px;padding:0 4px">
<h3>Статистика</h3>
<div style="font-size:11px;color:var(--text2)" id="statsText">Решено: 0 / 0</div>
</div>
</div></div>
<div class="main">
<div class="content" id="content"></div>
<div class="editor-panel">
<div class="er-bar">
<label>Редактор кода</label>
<div style="flex:1"></div>
<button class="btn sm" onclick="runAndCheck()">▶ Проверить</button>
<button class="btn outline sm" onclick="resetCode()">↺ Сброс</button>
<button class="btn outline sm" onclick="showHint()">💡 Подсказка</button>
</div>
<div class="er-row">
<div class="er-col"><textarea id="codeEditor" spellcheck="false"></textarea></div>
<div class="er-col"><div class="out" id="output">// Напиши код и нажми "Проверить"</div></div>
</div>
</div>
</div>
</div>
<div class="modal-overlay" id="loginModal">
<div class="modal">
<h2>Вход</h2>
<p>Email сохранит твой прогресс</p>
<input type="email" id="loginEmail" placeholder="email@example.com" onkeydown="if(event.key==='Enter')doLogin()">
<div class="merr" id="loginErr">Некорректный email</div>
<button class="btn" onclick="doLogin()">Войти</button>
<button class="btn outline" style="margin-top:6px" onclick="closeLogin()">Отмена</button>
</div>
</div>
<script>
// ====== LESSONS ======
const lessons = [
{title:"Основы print()",icon:"1",tasks:[
{name:"Привет, мир!",code:'print("Привет, мир!")',expect:"Привет, мир!",hint:'print("текст") — кавычки обязательны'},
{name:"Выводим числа",code:'print(42)\nprint(3 + 5)',expect:"42\n8",hint:'print(42) и print(3+5) без кавычек'},
{name:"Две строки",code:'print("Первая строка")\nprint("Вторая строка")',expect:"Первая строка\nВторая строка",hint:'Два print() — две строки'},
{name:"Несколько аргументов",code:'print("Я", "учу", "Python")',expect:"Я учу Python",hint:'print("слово1", "слово2") — пробел сам'}
]},
{title:"Переменные",icon:"2",tasks:[
{name:"Создаём переменную",code:'name = "Аня"\nprint(name)',expect:"Аня",hint:'name = "значение"; print(name)'},
{name:"Текст + переменная",code:'city = "Москва"\nprint("Я живу в", city)',expect:"Я живу в Москва",hint:'print("текст", переменная)'},
{name:"Две переменные",code:'name = "Макс"\nage = 10\nprint("Имя:", name, "Возраст:", age)',expect:"Имя: Макс Возраст: 10",hint:'print("текст", var1, "текст", var2)'},
{name:"Математика с переменными",code:'a = 10\nb = 4\nprint(a + b)\nprint(a - b)',expect:"14\n6",hint:'a = 10; b = 4; print(a+b); print(a-b)'}
]},
{title:"Типы данных",icon:"T",tasks:[
{name:"Типы значений",code:'print(type("Привет"))\nprint(type(42))\nprint(type(3.14))',expect:"<class 'str'>\n<class 'int'>\n<class 'float'>",hint:'type(значение) — показывает тип'},
{name:"Преобразование",code:'print(int(7.9))\nprint(float(3))\nprint(int("15") + 5)',expect:"7\n3.0\n20",hint:'int() — в целое, float() — в дробное'}
]},
{title:"Математика",icon:"+",tasks:[
{name:"Арифметика",code:'print(7 + 2)\nprint(7 - 2)\nprint(7 * 2)\nprint(7 / 2)',expect:"9\n5\n14\n3.5",hint:'+ - * / — обычные знаки'},
{name:"// и %",code:'print(17 // 5)\nprint(17 % 5)',expect:"3\n2",hint:'// — целая часть, % — остаток'},
{name:"Порядок действий",code:'print(5 + 2 * 3)\nprint((5 + 2) * 3)',expect:"11\n21",hint:'Сначала *, /, потом +, -. Скобки меняют порядок'}
]},
{title:"Условия if",icon:"⚖️",tasks:[
{name:"if/else",code:'age = 12\nif age >= 18:\n    print("Взрослый")\nelse:\n    print("Ребёнок")',expect:"Ребёнок",hint:'if условие: с новой строки с отступом'},
{name:"elif",code:'mark = 85\nif mark >= 90:\n    print("Отлично")\nelif mark >= 70:\n    print("Хорошо")\nelse:\n    print("Нормально")',expect:"Хорошо",hint:'elif = else + if'},
{name:"Знак числа",code:'x = -5\nif x > 0:\n    print("Плюс")\nelif x < 0:\n    print("Минус")\nelse:\n    print("Ноль")',expect:"Минус",hint:'if x>0: elif x<0: else:'},
{name:"Чётное/нечётное",code:'n = 7\nif n % 2 == 0:\n    print("Чётное")\nelse:\n    print("Нечётное")',expect:"Нечётное",hint:'n % 2 == 0 — чётное'}
]},
{title:"Цикл for",icon:"🔄",tasks:[
{name:"range()",code:'for i in range(5):\n    print(i)',expect:"0\n1\n2\n3\n4",hint:'range(N) — числа 0..N-1'},
{name:"С шагом",code:'for i in range(0, 10, 2):\n    print(i)',expect:"0\n2\n4\n6\n8",hint:'range(начало, конец, шаг)'},
{name:"Сумма чисел",code:'total = 0\nfor i in range(1, 6):\n    total = total + i\nprint(total)',expect:"15",hint:'total = total + i — накапливает'},
{name:"Таблица умножения",code:'for i in range(1, 6):\n    print("3 x", i, "=", 3*i)',expect:"3 x 1 = 3\n3 x 2 = 6\n3 x 3 = 9\n3 x 4 = 12\n3 x 5 = 15",hint:'print("3 x", i, "=", 3*i)'}
]},
{title:"Списки",icon:"📋",tasks:[
{name:"Индексы",code:'fruits = ["яблоко", "банан", "вишня"]\nprint(fruits[0])\nprint(fruits[-1])',expect:"яблоко\nвишня",hint:'список[0] — первый, [-1] — последний'},
{name:"Методы",code:'colors = ["красный", "синий"]\ncolors.append("зелёный")\nprint(len(colors))\nprint(colors)',expect:"3\n['красный', 'синий', 'зелёный']",hint:'.append() — в конец, len() — длина'},
{name:"for по списку",code:'for fruit in ["яблоко", "банан", "вишня"]:\n    print("Я люблю", fruit)',expect:"Я люблю яблоко\nЯ люблю банан\nЯ люблю вишня",hint:'for элемент in список:'}
]},
{title:"Словари",icon:"📖",tasks:[
{name:"Создание",code:'student = {"name": "Дима", "age": 10}\nprint(student["name"])\nprint(student["age"])',expect:"Дима\n10",hint:'словарь["ключ"] — получить'},
{name:"Изменение",code:'student = {"name": "Аня", "age": 9}\nstudent["age"] = 10\nstudent["city"] = "Казань"\nprint(student)',expect:"{'name': 'Аня', 'age': 10, 'city': 'Казань'}",hint:'словарь["ключ"] = значение'},
{name:"Перебор",code:'person = {"name": "Тимур", "age": 11, "hobby": "спорт"}\nfor key in person:\n    print(key, ":", person[key])',expect:"name : Тимур\nage : 11\nhobby : спорт",hint:'for key in dict: print(key, dict[key])'}
]},
{title:"Цикл while",icon:"♻️",tasks:[
{name:"Счётчик",code:'count = 0\nwhile count < 5:\n    print(count)\n    count += 1',expect:"0\n1\n2\n3\n4",hint:'while условие: — пока верно, повторяет'},
{name:"Обратный отсчёт",code:'n = 5\nwhile n > 0:\n    print(n)\n    n -= 1\nprint("Пуск!")',expect:"5\n4\n3\n2\n1\nПуск!",hint:'n -= 1 — уменьшить на 1'}
]},
{title:"Функции",icon:"⚙️",tasks:[
{name:"Создание",code:'def say_hello():\n    print("Привет!")\n    print("Рад тебя видеть!")\n\nsay_hello()',expect:"Привет!\nРад тебя видеть!",hint:'def имя(): тело с отступом'},
{name:"Параметры",code:'def greet(name):\n    print("Привет,", name, "!")\n\ngreet("Аня")\ngreet("Макс")',expect:"Привет, Аня !\nПривет, Макс !",hint:'def имя(параметр):'},
{name:"return",code:'def double(x):\n    return x * 2\n\nprint(double(5))\nprint(double(8))',expect:"10\n16",hint:'return значение — функция отдаёт результат'},
{name:"Два параметра",code:'def add(a, b):\n    return a + b\n\nprint(add(3, 5))\nprint(add(10, 7))',expect:"8\n17",hint:'def имя(п1, п2): return ...'}
]},
{title:"Строки",icon:"📝",tasks:[
{name:"Методы строк",code:'text = "Привет, Мир!"\nprint(text.upper())\nprint(text.lower())\nprint(len(text))',expect:"ПРИВЕТ, МИР!\nпривет, мир!\n12",hint:'.upper() — заглавные, .lower() — строчные'},
{name:"f-строки",code:'name = "Дима"\nage = 10\nprint(f"Меня зовут {name}, мне {age} лет")',expect:"Меня зовут Дима, мне 10 лет",hint:'f"текст {переменная}"'}
]},
{title:"Модули",icon:"📦",tasks:[
{name:"import math",code:'import math\nprint(math.sqrt(16))\nprint(math.pi)\nprint(math.floor(3.7))',expect:"4.0\n3.141592653589793\n3",hint:'import math — матем. модуль'},

let curLesson = 0, curTask = 0;

function stats() {
let total = 0, done = 0;
lessons.forEach((l,li) => l.tasks.forEach((t,ti) => { total++; if (progress[li+'_'+ti]) done++; }));
return {total,done};
}

function updateStats() {
const {total,done} = stats();
const st=document.getElementById('statsText');if(st)st.textContent=`Решено: ${done} / ${total}`;
const pb=document.getElementById('prBar');if(pb)pb.style.width=total?(done/total*100)+'%':'0%';
renderSidebar();
}

function markDone(li,ti) {
progress[li+'_'+ti] = true;
localStorage.setItem('lingx_progress', JSON.stringify(progress));
updateStats();
}

let openLesson = -1;

function renderSidebar() {
const el = document.getElementById('lessonList');
let h = '';
lessons.forEach((l,li) => {

// ====== RENDER THEORY ======
function renderTheory(md) {
let html = '', lines = md.split('\n'), inCode = false, codeLines = [];
let th = [], ta = [], tal = [];
for (let i = 0; i < lines.length; i++) {
const l = lines[i];
if (l.startsWith('```')) {
if (inCode) { html += '<pre><code>' + esc(codeLines.join('\n')) + '</code></pre>'; codeLines=[]; inCode=false; }
else inCode = true;
continue;
}
if (inCode) { codeLines.push(l); continue; }
if (l.startsWith('|') && l.endsWith('|')) {
const p = l.split('|').filter(x=>x.trim());
if (l.includes('---')) { tal = p.map(x=>x.includes(':')?'center':'left'); continue; }
if (!th.length) th = p; else ta.push(p);
continue;
} else if (th.length) { html += buildT(th,tal,ta); th=[]; ta=[]; }
if (l.startsWith('## ')) html += `<h3>${l.slice(3)}</h3>`;
else if (l.startsWith('> ')) html += `<div class="info">${inline(l.slice(2))}</div>`;
else if (l.startsWith('- ')) html += `<li style="margin:2px 0;color:var(--text2);font-size:13px">${inline(l.slice(2))}</li>`;
else if (l.trim()==='') html += '<br>';
else html += `<p style="font-size:14px">${inline(l)}</p>`;
}
if (inCode) html += '<pre><code>' + esc(codeLines.join('\n')) + '</code></pre>';
if (th.length) html += buildT(th,tal,ta);
return html;
}
function buildT(hd,al,rows) {
let h = '<table style="width:100%;border-collapse:collapse;margin:6px 0;font-size:13px"><thead><tr>';
hd.forEach((c,i) => { h += `<th style="border:1px solid var(--border);padding:5px;background:var(--code-bg);color:var(--accent);text-align:${al[i]||'left'}">${c}</th>`; });
h += '</tr></thead><tbody>';
rows.forEach(r => { h += '<tr>'; r.forEach((c,i) => { h += `<td style="border:1px solid var(--border);padding:5px;color:var(--text2);text-align:${al[i]||'left'}">${inline(c)}</td>`; }); h += '</tr>'; });
h += '</tbody></table>';
return h;
}
function inline(t) { return t.replace(/\`([^`]+)\`/g, '<code style="background:var(--code-bg);padding:1px 5px;border-radius:3px;color:var(--accent);font-size:13px">$1</code>'); }
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

let editor = null;
function loadCode() {
const t = lessons[curLesson].tasks[curTask];
if(!editor){
editor=CodeMirror.fromTextArea(document.getElementById('codeEditor'),{
mode:'python',
lineNumbers:true,
indentUnit:4,
tabSize:4,
indentWithTabs:false
});
editor.setSize('100%','100%');
}
editor.setValue(t.code);
document.getElementById('output').textContent = '// Напиши код и нажми "Проверить"';
document.getElementById('output').className = 'out';
}
function getCode(){return editor?editor.getValue():document.getElementById('codeEditor').value||'';}

function normalize(s) {
return s.replace(/\s+$/gm,'').replace(/^\s+/gm,'').replace(/[\r\n]+/g,'\n').trim();
}

function runAndCheck() {
const code = getCode();
const out = document.getElementById('output');
const ban = document.getElementById('resBan');
const task = lessons[curLesson].tasks[curTask];
out.textContent = ''; out.className = 'out'; ban.className = 'res-ban';
Sk.configure({output:s=>out.textContent+=s, read:builtinRead, __future__:Sk.python3});
try {
Sk.misceval.asyncToPromise(() => Sk.importMainWithBody("<stdin>",false,code,{syntaxerrors:"python3"})).then(() => {
const a = normalize(out.textContent);
const e = normalize(task.expect);
if (!task.expect) {
ban.textContent = 'Код выполнен! Попробуй изменить и запустить снова';
ban.className = 'res-ban ok'; return;
}
if (a === e) {
ban.textContent = 'Отлично! Всё верно!';
ban.className = 'res-ban ok';
markDone(curLesson, curTask);
const tasks = lessons[curLesson].tasks;
if (curTask + 1 < tasks.length) {
setTimeout(() => selectTask(curLesson, curTask + 1), 1200);
} else if (curLesson + 1 < lessons.length) {
setTimeout(() => { selectTask(curLesson + 1, 0); }, 1500);
} else {
ban.textContent += ' Поздравляю! Ты прошёл все уроки! 🎉';
}
} else {
ban.textContent = `Ошибка. Ожидалось:\n${task.expect}\n\nПолучено:\n${out.textContent}`;
ban.className = 'res-ban err';
}
}).catch(err => {
out.textContent = err.toString(); out.className = 'out';
ban.textContent = 'В коде синтаксическая ошибка!';
ban.className = 'res-ban err';
});
} catch(e) {
out.textContent = e.toString(); out.className = 'out';
ban.textContent = 'Ошибка!'; ban.className = 'res-ban err';
}
}

return Sk.builtinFiles["files"][x];
}
