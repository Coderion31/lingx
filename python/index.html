const THEORY={
"0_0":"## Твой первый код\n\nPython — язык, на котором ты говоришь компьютеру, что делать.\n\n**print()** — команда 'напечатай'. Компьютер выводит на экран то, что внутри скобок.\n\n```python\nprint(\"Привет, мир!\")\n```\n\nТекст в кавычках — это **строка**. Кавычки говорят компьютеру: 'это текст, не команда'.",
"0_1":"## Числа без кавычек\n\nЧисла можно выводить **без** кавычек. Компьютер их понимает.\n\n```python\nprint(42)\nprint(3 + 5)\n```\n\nPython сам посчитает `3 + 5` и выведет `8`.",
"0_2":"## Несколько строк\n\nОдин `print()` — одна строка. Хочешь две строки — напиши `print()` два раза.\n\n```python\nprint(\"Первая строка\")\nprint(\"Вторая строка\")\n```",
"0_3":"## Запятая в print()\n\nЕсли в `print()` несколько значений через запятую, Python ставит между ними пробел.\n\n```python\nprint(\"Меня зовут\", \"Дима\")\n```\n\nЗапятая — это 'склей с пробелом'.",
"1_0":"## Переменные — коробки\n\nПеременная — коробка с именем. Кладёшь туда значение знаком `=`.\n\n```python\nname = \"Аня\"\nage = 10\n```\n\nЗнак `=` — не 'равно', а **'положи в коробку'**.",
"1_1":"## Текст + переменная\n\nПеременные можно использовать с текстом через `,`:\n\n```python\ncity = \"Москва\"\nprint(\"Я живу в\", city)\n```\n\nЗапятая подставляет пробел между элементами.",
"1_2":"## Сколько угодно переменных\n\nВ `print()` можно передать сколько угодно значений через запятую.",
"1_3":"## Считаем через переменные\n\n```python\na = 5\nb = 3\nprint(a + b)  # 8\nprint(a * b)  # 15\n```",
"2_0":"## Типы данных\n\nКаждое значение имеет тип.\n\n- **str** — строка (текст), в кавычках\n- **int** — целое число, без кавычек\n- **float** — дробное число, с точкой\n\n`type()` показывает тип значения.",
"2_1":"## Преобразование типов\n\nМожно превращать одно в другое:\n\n- `int(3.7)` → `3`\n- `float(5)` → `5.0`\n- `int(\"10\")` → `10`",
"3_0":"## Арифметика\n\n| Действие | Знак |\n|----------|------|\n| Сложение | `+` |\n| Вычитание | `-` |\n| Умножение | `*` |\n| Деление | `/` |\n\nДеление всегда даёт дробное число.",
"3_1":"## Целая часть и остаток\n\n`//` — сколько раз помещается (целая часть)\n`%` — сколько осталось (остаток)\n\n```python\nprint(9 // 2)  # 4\nprint(9 % 2)   # 1\n```\n\n**Как запомнить:** 9 конфет на 2 друзей. Каждому по 4, 1 остался.",
"3_2":"## Порядок действий\n\nКак в математике: сначала в скобках, потом умножение/деление, потом сложение/вычитание.\n\n```python\nprint(2 + 3 * 4)    # 14\nprint((2 + 3) * 4)  # 20\n```",
"4_0":"## if/else\n\n`if` — 'если'. Компьютер проверяет условие и выбирает, что делать.\n\n**Важно:** после `if` и `else` — `:`. Внутри — 4 пробела.\n\n| Знак | Значение |\n|------|----------|\n| `==` | равно |\n| `!=` | не равно |\n| `>` | больше |\n| `<` | меньше |\n| `>=` | больше или равно |\n| `<=` | меньше или равно |",
"4_1":"## elif\n\nКогда нужно больше двух вариантов — `elif` ('иначе если').\n\nПроверка идёт сверху вниз. Как только нашлось подходящее — Python останавливается.",
"4_2":"## Знак числа\n\nНапиши программу, которая определяет знак числа: положительное, отрицательное или ноль.",
"4_3":"## Чётное/нечётное\n\nЧисло чётное, если `число % 2 == 0`. Остаток от деления на 2 равен 0.",
"5_0":"## Цикл for\n\n`for` — команда 'для каждого'. Повторяет код несколько раз.\n\n`range(5)` — числа от **0** до **4** (5 не включается).",
"5_1":"## range с шагом\n\n`range(начало, конец, шаг)`\n\nКонец **не включается**!",
"5_2":"## Сумма в цикле\n\n`total = total + i` — 'возьми total, прибавь i, сохрани обратно'. Так накапливается сумма.",
"5_3":"## Таблица умножения\n\nВыводим таблицу умножения через цикл и f-строки.",
"6_0":"## Список\n\nСписок — коллекция в `[]`.\n\n**Нумерация с 0!** `list[0]` — первый. `list[-1]` — последний.",
"6_1":"## Методы списков\n\n- `.append()` — добавить в конец\n- `.insert()` — вставить на место\n- `.remove()` — удалить\n- `len()` — длина",
"6_2":"## for по списку\n\n`for` отлично работает со списками. На каждом шаге переменная получает следующий элемент.",
"7_0":"## Словарь\n\nСловарь — `{}` с парами `ключ: значение`.\n\nКлюч — как ярлык на коробке. Говоришь 'name' — достаётся 'Дима'.",
"7_1":"## Изменение словаря\n\nВ словарь можно добавлять новые ключи и менять старые.",
"7_2":"## Перебор словаря\n\n`for` перебирает **ключи** словаря.",
"8_0":"## while — 'пока'\n\n`while` повторяет код, **пока** условие верно.\n\n⚠️ Не забывай менять переменную в условии! Иначе цикл будет бесконечным.",
"8_1":"## Обратный отсчёт\n\n`n -= 1` — уменьшаем на 1 каждый раз. Когда n станет 0 — цикл кончится.",
"9_0":"## Твоя собственная команда\n\n`def` — 'определить функцию'. Это твоя личная команда.\n\n`def` → имя → `()` → `:` → тело с отступом.",
"9_1":"## Параметры\n\nФункция может принимать данные — **параметры**. При каждом вызове подставляется новое значение.",
"9_2":"## return\n\n`return` — функция **возвращает** значение обратно. Без `return` функция ничего не отдаёт.",
"9_3":"## Два параметра\n\nУ функции может быть сколько угодно параметров.",
"10_0":"## Методы строк\n\nУ строк есть встроенные методы: `.upper()`, `.lower()`, `.replace()`, `len()`.",
"10_1":"## f-строки\n\nЕсли перед строкой поставить `f`, можно вставлять переменные в `{}`.\n\nГораздо удобнее, чем склеивать запятыми!",
"11_0":"## import math\n\nМодуль — набор готовых функций. `import` — 'загрузить'.\n\n`math.sqrt()` — корень, `math.pi` — число π, `math.floor()` — вниз.",
"11_1":"## random\n\nМодуль `random` умеет выбирать случайно. `random.randint(1,10)` — число от 1 до 10.",
"11_2":"## Угадайка\n\nСобираем игру: компьютер загадывает число, ты угадываешь.",
"12_0":"## Калькулятор\n\nСобираем всё вместе — программа, которая считает и выводит все операции.",
"12_1":"## Список учеников\n\nРабота с данными: список, цикл, f-строки.",
"12_2":"## Чат-бот\n\nПростой бот, который отвечает на приветствие.",
"12_3":"## Генератор паролей\n\nСобираем всё, что выучил, в полезную программу."
};

let curLesson=0,curTask=0,openLesson=-1,revealed={};
let progress=JSON.parse(localStorage.getItem(P+'_progress')||'{}');
renderSidebar();renderContent();

function stats(){let t=0,d=0;LESSONS.forEach((l,li)=>l.tasks.forEach((x,ti)=>{t++;if(progress[li+'_'+ti])d++}));return{t,d}}
function updateStats(){const{t,d}=stats();const el=document.getElementById('statsText');if(el)el.textContent=d+' / '+t;renderSidebar()}
function syncProgress(){var tok=localStorage.getItem('lingx_token');if(!tok)return;var pr={};try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('sbj_')===0&&k.indexOf('_progress')>0){try{pr[k.replace('_progress','')]=JSON.parse(localStorage.getItem(k))}catch(e){}}}}catch(e){}fetch((typeof API!=='undefined'&&API?API:'/api')+'/me',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tok,progress:pr})}).catch(function(){})}
(function(){setTimeout(syncProgress,1200)})();
function markDone(li,ti){progress[li+'_'+ti]=true;localStorage.setItem(P+'_progress',JSON.stringify(progress));updateStats();syncProgress()}
function renderSidebar(){const el=document.getElementById('lessonList');let h='';LESSONS.forEach((l,li)=>{const ld=l.tasks.filter((x,ti)=>progress[li+'_'+ti]).length;h+='<div class="lgrp"><div class="lgrp-hdr" onclick="toggleLesson('+li+')"><span class="arr '+(openLesson===li?'open':'')+'">▶</span>'+(li+1)+'. '+l.title+'<span class="cnt">'+ld+'/'+l.tasks.length+'</span></div><div class="lgrp-body '+(openLesson===li?'open':'')+'">';l.tasks.forEach((t,ti)=>{h+='<div class="ltask'+(li===curLesson&&ti===curTask?' active':'')+'" data-li="'+li+'" data-ti="'+ti+'" onclick="selectTask('+li+','+ti+')"><span class="dot'+(progress[li+'_'+ti]?' done':'')+'"></span>'+t.name+'</div>'});h+='</div></div>'});el.innerHTML=h}
function isRevealed(li,ti){return revealed[li+'_'+ti]===true}
function selectTask(li,ti){
curLesson=li;curTask=ti;openLesson=li;
document.getElementById('editorPanel').classList.remove('open');
document.querySelectorAll('#lessonList .ltask').forEach(function(el){el.classList.toggle('active',+el.getAttribute('data-li')===li&&+el.getAttribute('data-ti')===ti)});
document.querySelectorAll('#lessonList .lgrp').forEach(function(g,idx){var body=g.querySelector('.lgrp-body'),arr=g.querySelector('.arr'),on=idx===li;if(body)body.classList.toggle('open',on);if(arr)arr.classList.toggle('open',on)});
renderContent()}
function toggleLesson(li){
openLesson=openLesson===li?-1:li;
document.querySelectorAll('#lessonList .lgrp').forEach(function(g,idx){
var body=g.querySelector('.lgrp-body'),arr=g.querySelector('.arr');
var on=idx===openLesson;
if(body)body.classList.toggle('open',on);
if(arr)arr.classList.toggle('open',on);
});
}
function gotIt(li,ti){
revealed[li+'_'+ti]=true;
const g=document.getElementById('gateBox');
if(g)g.innerHTML='<span class="dim">Задание открыто. Пиши код в редакторе ниже 👇</span>';
document.getElementById('editorPanel').classList.add('open');
loadCode();
setTimeout(()=>{const p=document.getElementById('editorPanel');if(p)p.scrollIntoView({behavior:'smooth',block:'start'})},60);
}
function renderContent(){
const c=document.getElementById('content');const l=LESSONS[curLesson];const t=l.tasks[curTask];
let h='<h2>'+l.title+'</h2><div class="task-box"><h4>'+t.name+'</h4><div class="theory">'+renderTheory(THEORY[curLesson+'_'+curTask]||'## Задание\n\nНапиши код, который выводит ожидаемый результат.')+'</div><div class="gate" id="gateBox">';
if(isRevealed(curLesson,curTask)){h+='<span class="dim">Задание открыто. Пиши код в редакторе ниже 👇</span>'}
else{h+='<button class="btn-gotit" onclick="gotIt('+curLesson+','+curTask+')">К заданию →</button>'}
h+='</div></div>';c.innerHTML=h;
document.getElementById('taskLabel').textContent='Задание '+l.title;
document.getElementById('taskTarget').textContent='Нужно вывести: '+t.expect;
if(isRevealed(curLesson,curTask)){document.getElementById('editorPanel').classList.add('open');loadCode()}
}

function getTheory(li,ti){return THEORY[li+'_'+ti]||'## Задание\n\nНапиши код, который выводит ожидаемый результат.'}

function renderTheory(md){
let html='',lines=md.split('\n'),inCode=false,codeLines=[];
let th=[],ta=[],tal=[];
for(let i=0;i<lines.length;i++){const l=lines[i];
if(l.startsWith('```')){if(inCode){html+='<pre><code>'+esc(codeLines.join('\n'))+'</code></pre>';codeLines=[];inCode=false}else inCode=true;continue}
if(inCode){codeLines.push(l);continue}
if(l.startsWith('|')&&l.endsWith('|')){const p=l.split('|').filter(x=>x.trim());if(l.includes('---')){tal=p.map(x=>x.includes(':')?'center':'left');continue}if(!th.length)th=p;else ta.push(p);continue}
else if(th.length){html+=buildT(th,tal,ta);th=[];ta=[]}
if(l.startsWith('## '))html+='<h3>'+l.slice(3)+'</h3>';
else if(l.startsWith('> '))html+='<div class="info">'+inline(l.slice(2))+'</div>';
else if(l.startsWith('- '))html+='<li>'+inline(l.slice(2))+'</li>';
else if(l.trim()==='')html+='<br>';
else html+='<p>'+inline(l)+'</p>';}
if(inCode)html+='<pre><code>'+esc(codeLines.join('\n'))+'</code></pre>';
if(th.length)html+=buildT(th,tal,ta);
return html;
}
function buildT(hd,al,rows){let h='<table><thead><tr>';hd.forEach((c,i)=>{h+='<th style="text-align:'+(al[i]||'left')+'">'+c+'</th>'});h+='</tr></thead><tbody>';rows.forEach(r=>{h+='<tr>';r.forEach((c,i)=>{h+='<td style="text-align:'+(al[i]||'left')+'">'+inline(c)+'</td>'});h+='</tr>'});h+='</tbody></table>';return h}
function inline(t){return String(t).replace(/\`([^`]+)\`/g,'<code>$1</code>')}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

let editor=null;
function loadCode(){
const t=LESSONS[curLesson].tasks[curTask];
if(!editor){editor=CodeMirror.fromTextArea(document.getElementById('codeEditor'),{mode:'python',lineNumbers:true,indentUnit:4,tabSize:4,indentWithTabs:false});editor.setSize('100%','100%')}
editor.setValue(t.code);
const o=document.getElementById('output');o.textContent='// Напиши код и нажми "Проверить"';o.className='out';
const ban=document.getElementById('resBan');
}
function getCode(){return editor?editor.getValue():document.getElementById('codeEditor').value||''}
function normalize(s){return String(s).replace(/\s+$/gm,'').replace(/^\s+/gm,'').replace(/[\r\n]+/g,'\n').trim()}
function runAndCheck(){
const code=getCode();const out=document.getElementById('output');const ban=document.getElementById('resBan');const task=LESSONS[curLesson].tasks[curTask];
if(!task){return}
if(!ban){
out.textContent=code?code:'нет кода';return;
}
out.textContent='';out.className='out';ban.className='res-ban';
Sk.configure({output:s=>out.textContent+=s,read:builtinRead,__future__:Sk.python3});
try{Sk.misceval.asyncToPromise(()=>Sk.importMainWithBody("<stdin>",false,code,{syntaxerrors:"python3"})).then(()=>{const a=normalize(out.textContent);const e=normalize(task.expect);if(!task.expect){ban.textContent='Код выполнен! Попробуй изменить и запустить снова';ban.className='res-ban ok';return}if(a===e){ban.textContent='Отлично! Всё верно!';ban.className='res-ban ok';markDone(curLesson,curTask);if(curTask+1<LESSONS[curLesson].tasks.length){setTimeout(()=>selectTask(curLesson,curTask+1),1200)}else if(curLesson+1<LESSONS.length){setTimeout(()=>selectTask(curLesson+1,0),1500)}else{ban.textContent+=' Поздравляю! Ты прошёл все уроки! 🎉'}}else{ban.textContent='Ошибка. Ожидалось:\n'+task.expect+'\n\nПолучено:\n'+out.textContent;ban.className='res-ban err'}}).catch(err=>{out.textContent=err.toString();out.className='out';if(ban){ban.textContent='В коде синтаксическая ошибка!';ban.className='res-ban err'}})}catch(e){out.textContent=e.toString();out.className='out';if(ban){ban.textContent='Ошибка!';ban.className='res-ban err'}}
}
function builtinRead(x){if(Sk.builtinFiles===undefined||Sk.builtinFiles["files"][x]===undefined)throw new Error("Not found: "+x);return Sk.builtinFiles["files"][x]}
function resetCode(){loadCode();const ban=document.getElementById('resBan');if(ban)ban.className='res-ban'}
function showHint(){const t=LESSONS[curLesson].tasks[curTask];const o=document.getElementById('output');if(o){o.textContent='💡 Подсказка: '+t.hint;o.className='out'}}

function toggleMenu(){document.getElementById('menuOverlay').classList.toggle('open')}
function closeMenu(){document.getElementById('menuOverlay').classList.remove('open')}
function toggleSubmenu(id,el){const body=document.getElementById(id);const arr=el?el.querySelector('.m-arr'):null;body.classList.toggle('open');if(arr)arr.classList.toggle('open')}
updateStats();(function(){var el=document.getElementById('lessonList');if(el){el.classList.add('lgrpAnim');setTimeout(function(){el.classList.remove('lgrpAnim')},900)}})();
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeMenu()});
</script>
</body>
